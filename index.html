<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FM27 Tactic Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ekran taktyki FM27 — granatowo-fioletowe tło, turkusowe pasy nagłówków, znaczniki zawodników w kolorach linii */
:root{
  --bg:#0e0b24; --glow:rgba(110,60,220,.28); --surface:#1a1644; --surface-2:#221c56; --line:#352f70;
  --band:#16695e; --band-2:#1d8574; --ink:#eef0fa; --muted:#a8abd0;
  --accent:#2fd3a7; --accent-ink:#052a21; --oop:#f5a524;
  --warn-bg:#3b2a12; --warn-ink:#ffd27f; --ok-bg:#0f3a31; --ok-ink:#86ecc9; --info-bg:#1f2759; --info-ink:#b3c3ff;
  --pitch:#1c5b3c; --pitch-2:#195335; --chalk:rgba(255,255,255,.5);
  --lGK:#5d6b88; --lD:#178f6c; --lM:#2f9a52; --lAM:#7446d6; --lST:#c21f78;
  --dD:#5b9bff; --dS:#f0d050; --dA:#ff5d73;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 520px at 8% -8%,var(--glow),transparent 70%),radial-gradient(900px 500px at 100% 0,rgba(22,105,94,.22),transparent 70%),var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1260px;margin:0 auto;display:grid;gap:24px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:grid;gap:6px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,54px);line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:0;color:var(--muted);max-width:70ch}
.bmc{display:inline-flex;align-items:center;gap:8px;background:#ffdd00;color:#1b1400;font:700 14px var(--f-body);text-decoration:none;border-radius:999px;padding:8px 16px;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s}
.bmc:hover{transform:translateY(-1px)}
.bmc:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bmc.big{font-size:16px;padding:12px 22px;white-space:nowrap}
.card.support{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;border:2px solid #ffdd00;background:linear-gradient(120deg,var(--surface),rgba(255,221,0,.08))}
.card.support > div{min-width:0;flex:1 1 320px}
.hl-right{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--f-display);color:#fff;line-height:1}
.ring .num small{display:block;font:600 9.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:2px;text-align:center}
.scorecard{gap:12px}
.sc-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sc-total{font:700 30px var(--f-display);font-variant-numeric:tabular-nums}
.sc-total span{font-size:16px;color:var(--muted)}
.sc-total b{font:600 15px var(--f-body);margin-left:8px;padding:2px 10px;border-radius:999px;color:#111;vertical-align:4px}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
@media (max-width:700px){.bars{grid-template-columns:minmax(0,1fr)}}
.bar-h{display:flex;justify-content:space-between;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bar-h span:last-child{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.bar-d{font-size:12.5px;color:var(--muted)}
.hdr-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{font:600 14px var(--f-body);letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:8px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--band);color:#fff}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}

.grid{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:940px){.grid{grid-template-columns:minmax(0,1fr)}}
form{display:grid;gap:18px;position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
@media (max-width:940px){form{position:static}}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;font-size:15px;padding:0;margin-bottom:8px;letter-spacing:.02em}
legend small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:7px 11px;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s}
.chips label:hover{border-color:var(--band-2)}
.chips input:checked+label{background:var(--band);border-color:var(--accent);color:#fff;font-weight:600}
.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.chips.big label{padding:9px 13px;font-size:15px}
.coachbox select{font:600 15px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--band-2);border-radius:8px;padding:10px 12px;width:100%;cursor:pointer}
.coachbox select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{margin:0;font-size:13px;color:var(--muted)}
dt .coach-mark{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:#c9b6ff;border:1px solid #9b7bff;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.pis.coach{color:#c9b6ff}
.adv{border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;background:var(--bg)}
.adv label.sw{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600;font-size:15px}
.adv input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.adv p{margin:0;font-size:13px;color:var(--muted)}

.result{display:grid;gap:22px;min-width:0}
.headline{display:flex;flex-wrap:nowrap;gap:10px 18px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--band),var(--band-2));border-radius:10px;padding:14px 18px;color:#fff}
.headline > div:first-child{min-width:0}
.headline .name{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1;text-transform:uppercase;letter-spacing:.02em}
.headline .sub{font-size:14.5px;opacity:.9}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:3px 7px;background:rgba(0,0,0,.18);color:#fff}
.tag b{font-weight:500;opacity:.75;margin-right:4px}

.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:1120px){.board{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.toggle button{font:600 14px var(--f-body);border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--band);color:#fff}
.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.shape-caption{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
svg.pitch{width:100%;max-width:520px;height:auto;display:block;border-radius:8px;margin:0 auto}
.pl{transition:transform .6s cubic-bezier(.5,0,.2,1)}
@media (prefers-reduced-motion:reduce){.pl{transition:none}}
.variants .chips label{font-size:13px;padding:5px 9px;font-family:var(--f-mono)}

.tablebox{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.pos{white-space:nowrap}
td.pos b{display:inline-block;font-family:var(--f-display);font-size:15px;color:#fff;border-radius:4px;padding:1px 7px;margin-bottom:3px}
td.pos span{display:block;font-size:12px;color:var(--muted)}
.role{font-weight:600}
.duty{font-family:var(--f-mono);font-size:11px;border-radius:3px;padding:1px 5px;margin-left:5px;color:#111;vertical-align:1px;font-weight:500}
.duty.D{background:var(--dD)} .duty.S{background:var(--dS)} .duty.A{background:var(--dA)}
.desc{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.pis{display:block;font-size:12.5px;font-family:var(--f-mono);color:var(--accent);margin-top:2px}
.ph{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ph.ip{background:var(--accent)} .ph.oop{background:var(--oop)}

.instr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.instr{grid-template-columns:minmax(0,1fr)}}
.card h3.band{background:var(--band);color:#fff;margin:-16px -16px 4px;padding:9px 16px;border-radius:12px 12px 0 0}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:4px;border-top:1px solid var(--line);padding-top:8px}
.grp:first-of-type{border-top:0;padding-top:0}
dl{margin:0;display:grid;gap:8px}
dl div{display:grid;gap:1px}
dt{font-size:14px;font-weight:600}
dt .val{color:var(--accent)}
dt .adv-mark{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--oop);border:1px solid var(--oop);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
dd{margin:0;font-size:13px;color:var(--muted)}
.untouched{font-size:13px;color:var(--muted);margin:8px 0 0}

.checks{display:grid;gap:8px}
.chk{border-radius:8px;padding:10px 14px;font-size:14.5px;display:grid;gap:2px;border-left:4px solid currentColor}
.chk strong{font-weight:700}
.chk.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chk.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chk.info{background:var(--info-bg);color:var(--info-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 14px var(--f-body);letter-spacing:.02em;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:9px 16px;cursor:pointer}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent)}
.copied{font-size:13px;color:var(--muted)}
textarea.fb{width:100%;min-height:150px;font-family:var(--f-mono);font-size:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;word-break:break-all}
.fmf{border:2px solid var(--band-2)}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.mono{font-family:var(--f-mono);font-size:13px}
details{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--accent)}
details[open] summary{margin-bottom:8px}
details.alt{border-top:0;padding-top:0}
.note{margin:0;font-size:13px;color:var(--muted)}
a.bm{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-decoration:none;padding:11px 18px;border-radius:8px;cursor:grab;border:2px dashed var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
a.bm:active{cursor:grabbing}
a.bm:focus-visible{outline:2px solid #fff;outline-offset:3px}
.setup{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
footer{font-size:13px;color:var(--muted);max-width:90ch;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
footer p{margin:0}
footer .credit{color:var(--ink);font-size:14px}
footer .credit b{color:var(--accent);font-family:var(--f-display);letter-spacing:.04em;font-size:15px}
.brand{display:flex;gap:18px;align-items:flex-start}.brand>div{display:grid;gap:6px;min-width:0}.brand-logo{width:60px;height:60px;border-radius:50%;flex:none;opacity:.9;box-shadow:0 0 0 1px rgba(255,255,255,.08);margin-top:24px}@media(max-width:560px){.brand{flex-direction:column;gap:12px}.brand-logo{width:48px;height:48px;margin-top:0}}
footer .disc{font-size:12px;opacity:.85}
</style>

const TI=[
 ["passing-directness","in","Overview","Passing Directness","Standard","PASSING_DIRECTNESS",["Długość podań. Krótsze to bezpieczniej i więcej posiadania, bardziej bezpośrednie to szybciej do przodu, ale więcej strat.","Pass length. Shorter is safer and keeps the ball; more direct moves it forward faster but loses it more often.","Longitud del pase. Más corto es más seguro y da posesión; más directo avanza antes, pero se pierde más el balón.","Passlänge. Kürzer ist sicherer und bringt Ballbesitz, direkter geht schneller nach vorn, kostet aber mehr Ballverluste.","Longueur des passes. Plus courtes, c'est plus sûr et on garde le ballon ; plus directes, on avance plus vite mais on le perd plus souvent.","传球长度。更短更安全，能保住球权；更直接推进更快，但丢球更多。"]],
 ["tempo","in","Overview","Tempo","Normal","TEMPO",["Jak szybko drużyna gra piłką. Wyższe tempo daje więcej akcji, ale też więcej strat i szybsze zmęczenie.","How quickly the team plays the ball. Higher tempo means more attacks but also more turnovers and faster fatigue.","Velocidad con la que el equipo mueve el balón. Más ritmo da más ataques, pero también más pérdidas y más cansancio.","Wie schnell das Team den Ball laufen lässt. Höheres Tempo bringt mehr Angriffe, aber auch mehr Ballverluste und schnellere Ermüdung.","La vitesse à laquelle l'équipe fait circuler le ballon. Un tempo plus élevé donne plus d'attaques, mais aussi plus de pertes de balle et une fatigue plus rapide.","球队传球的速度。节奏越快，进攻越多，但失误也更多，体能消耗更快。"]],

 ["attacking-transition","in","Overview","Attacking Transition","Standard","ATTACKING_TRANSITION",["Co robić po odbiorze piłki: szybki atak (Counter-Attack) albo uspokoić grę i się ustawić (Hold Shape).","What to do after winning the ball: attack fast (Counter-Attack) or calm down and get into shape (Hold Shape).","Qué hacer tras recuperar: atacar rápido (Counter-Attack) o calmar el juego y ordenarse (Hold Shape).","Was nach Ballgewinn passiert: schnell angreifen (Counter-Attack) oder beruhigen und ordnen (Hold Shape).","Que faire après la récupération : attaquer vite (Counter-Attack) ou calmer le jeu et se replacer (Hold Shape).","抢断后怎么做：快速进攻（Counter-Attack），还是放慢节奏、重新落位（Hold Shape）。"]],
 ["creative-freedom","in","Overview","Creative Freedom","Balanced","CREATIVE_FREEDOM",["Swoboda zawodników. Więcej ekspresji to improwizacja, więcej dyscypliny to trzymanie się planu.","Player freedom. More expressive means improvisation, more disciplined means sticking to the plan.","Libertad de los jugadores. Más expresivo es improvisación; más disciplinado es ceñirse al plan.","Freiheit der Spieler. Expressiver heißt Improvisation, disziplinierter heißt, sich an den Plan zu halten.","Liberté des joueurs. Plus expressif, c'est de l'improvisation ; plus discipliné, on s'en tient au plan.","球员的自由度。更有表现力意味着更多即兴发挥，更有纪律意味着严格执行计划。"]],

 ["goal-kicks","in","Build-Up","Goal Kicks","Mixed","GOAL_KICKS",["Rozpoczęcie od bramki: krótko do obrońców albo długo.","Goal kicks: short to the defenders or long.","Saques de puerta: en corto a los defensas o en largo.","Abstöße: kurz zu den Verteidigern oder lang.","Six mètres : courts vers les défenseurs ou longs.","球门球：短传给后卫，还是开大脚。"]],
 ["gk-distribution","in","Build-Up","GK Distribution","Balanced","GOALKEEPER_DISTRIBUTION",["Do kogo bramkarz zagrywa po złapaniu piłki.","Who the keeper plays to after catching the ball.","A quién juega el portero tras atrapar el balón.","Wen der Torwart nach dem Fangen anspielt.","À qui le gardien joue après avoir capté le ballon.","门将接球后传给谁。"]],

 ["shots-from-distance","in","Final Third","Shots From Distance","Balanced","SHOTS_FROM_DISTANCE",["Strzały zza pola karnego: częściej czy rzadziej.","Shots from outside the box: more or less often.","Tiros desde fuera del área: más o menos a menudo.","Schüsse von außerhalb des Strafraums: öfter oder seltener.","Tirs de loin : plus ou moins souvent.","禁区外远射：更多还是更少。"]],
 ["crossing-style","in","Final Third","Crossing Style","Balanced","CROSSING_STYLE",["Rodzaj dośrodkowań: górne, bite czy niskie.","Type of crosses: floated, whipped or low.","Tipo de centros: bombeados, tensos o rasos.","Art der Flanken: hoch, scharf oder flach.","Type de centres : lobés, fouettés ou à ras de terre.","传中类型：高吊、弧线快速传中或地面低平球。"]],
 ["line-of-engagement","out","Overview","Line of Engagement","Mid Block","LINE_OF_ENGAGEMENT",["Gdzie zaczyna się pressing: wysoko pod bramką rywala, w środku pola czy dopiero przed własnym polem karnym.","Where the press starts: high near the opposition goal, in midfield, or only in front of your own box.","Dónde empieza la presión: arriba cerca de la portería rival, en el centro del campo o solo delante de tu área.","Wo das Pressing beginnt: hoch vor dem gegnerischen Tor, im Mittelfeld oder erst vor dem eigenen Strafraum.","Où commence le pressing : haut près du but adverse, au milieu, ou seulement devant votre surface.","压迫从哪里开始：靠近对方球门的高位、中场，或只在自己禁区前。"]],
 ["defensive-line","out","Overview","Defensive Line","Standard","DEFENSIVE_LINE",["Jak wysoko stoi linia obrony. Wyżej to mniej miejsca dla rywala w środku, ale więcej za plecami obrońców.","How high the defensive line sits. Higher means less space in midfield for opponents, but more space behind your defenders.","Altura de la línea defensiva. Más alta deja menos espacio al rival en el centro, pero más a la espalda de tus defensas.","Wie hoch die Abwehrlinie steht. Höher heißt weniger Raum für den Gegner im Zentrum, aber mehr Raum hinter deinen Verteidigern.","La hauteur de la ligne défensive. Plus haute, l'adversaire a moins d'espace au milieu, mais il y en a plus dans le dos de vos défenseurs.","防线的高度。越高，对手在中场的空间越小，但你后卫身后的空间越大。"]],
 ["defensive-line-behaviour","out","Overview","Defensive Line Behaviour","Balanced","DEFENSIVE_LINE_BEHAVIOR",["Czy obrońcy wychodzą do przodu, czy cofają się, gdy rywal atakuje.","Whether defenders step up or drop off when the opponent attacks.","Si los defensas salen hacia delante o retroceden cuando ataca el rival.","Ob die Verteidiger herausrücken oder sich zurückfallen lassen, wenn der Gegner angreift.","Les défenseurs montent ou reculent quand l'adversaire attaque.","对手进攻时，后卫是上前还是后撤。"]],

 ["defensive-transition","out","Overview","Defensive Transition","Standard","DEFENSIVE_TRANSITION",["Co robić po stracie piłki: od razu ją odbierać (Counter-Press) czy wrócić na pozycje (Regroup).","What to do after losing the ball: win it back immediately (Counter-Press) or get back into position (Regroup).","Qué hacer tras perder el balón: recuperarlo al instante (Counter-Press) o volver a la posición (Regroup).","Was nach Ballverlust passiert: sofort zurückerobern (Counter-Press) oder in die Positionen zurückkehren (Regroup).","Que faire après la perte du ballon : le récupérer tout de suite (Counter-Press) ou se replacer (Regroup).","丢球后怎么做：立即反抢（Counter-Press），还是退回落位（Regroup）。"]],
 ["tackling","out","Overview","Tackling","Standard","TACKLING",["Ostrość odbioru. Ostrzej to więcej odbiorów i więcej kartek.","How hard players tackle. Harder means more ball wins and more cards.","Dureza en la entrada. Más dura da más recuperaciones y más tarjetas.","Härte im Zweikampf. Härter heißt mehr Ballgewinne und mehr Karten.","La dureté des tacles. Plus durs, c'est plus de ballons gagnés et plus de cartons.","铲抢的力度。越凶狠，抢回球越多，吃牌也越多。"]],
 ["pressing-trap","out","Pressing","Pressing Trap","Balanced","PRESSING_TRAP",["Gdzie spychać rywala z piłką: do środka czy do linii bocznej.","Where to force the player on the ball: inside or towards the touchline.","Hacia dónde empujar al rival con balón: hacia dentro o hacia la banda.","Wohin der ballführende Gegner gedrängt wird: nach innen oder zur Seitenlinie.","Où pousser le porteur du ballon : vers l'intérieur ou vers la ligne de touche.","把持球人逼向哪里：中路还是边线。"]],

 eachSteps:"<li>Haz clic en <b>Copiar receta</b> abajo.</li><li>Abre <span class=\"mono\">tactics.sortitoutsi.net</span> (con «tactics.» al principio, no el foro de sortitoutsi.net) en otra pestaña e <b>inicia sesión</b> (si no tienes cuenta, regístrate primero). Solo cuando hayas iniciado sesión, haz clic en el marcador <b>FM27 → archivo</b>.</li><li>En la ventana que aparece, pega la receta (Ctrl+V) y haz clic en <b>Crear archivo .fmf</b>. El archivo se guarda en Descargas.</li><li>En el juego: pantalla de tácticas → <b>Load Tactic</b> → elige el archivo descargado.</li>",
 copyRecipe:"Copiar receta",recipeCopied:"Copiado. Ahora abre tactics.sortitoutsi.net en otra pestaña, inicia sesión y haz clic en el marcador FM27 → archivo.",howSum:"Cómo funciona",
 howTxt:"El marcador solo funciona en tactics.sortitoutsi.net y usa su editor de tácticas. Toma un preset oficial de FM27 como base, le aplica los ajustes de la receta y al final te dice si todo ha ido bien. La web limita el número de peticiones, así que si haces varios archivos seguidos el marcador espera y lo reintenta solo: hazlos de uno en uno. Los archivos de FM27 de esta web aún no están verificados del todo con el juego, así que tras cargarlos compara la táctica con el generador.",
 footer:"Datos: 90 presets oficiales de FM27 (Sports Interactive) leídos desde tactics.sortitoutsi.net y pruebas de tácticas de la versión de prueba de 5 días de FM27. Los nombres de roles e instrucciones están en inglés, como en el juego. El motor cambiará con las actualizaciones, así que toma el resultado como un buen punto de partida y ajústalo a tus jugadores tras 5–6 partidos.",

 c_gapOk_t:"Presión alta con línea baja",c_gapOk_b:"Queda una zona libre entre la presión y la defensa. La cierran {n} mediocentros defensivos sin balón. Este patrón viene de las pruebas de la versión de prueba, no de los presets de SI.",
 c_gapBad_t:"Hueco entre presión y defensa",c_gapBad_b:"Una presión alta con la línea defensiva baja deja mucho espacio al rival en el centro. Elige una forma sin balón con dos mediocentros defensivos (2DM o 4-2-2-2 DM).",
 c_highSK_t:"Línea defensiva alta",c_highSK_b:"Necesitas centrales rápidos (Velocidad y Aceleración en torno a 13+). El Sweeper Keeper cubre los balones a la espalda.",
 c_highNoSK_t:"Línea defensiva alta",c_highNoSK_b:"Una línea alta sin Sweeper Keeper deja espacio vacío a la espalda de la defensa. Cambia el rol del portero sin balón a Sweeper Keeper o baja la línea.",
 c_stamina_t:"Mucha carga física",c_stamina_b:"La contrapresión y el ritmo alto cansan rápido, y en FM27 la condición física baja más deprisa que antes. Planifica cambios hacia el minuto 60 y rota la plantilla.",

 c_complex_t:"Táctica compleja",c_complex_b:"{n} instrucciones cambiadas. En FM27 una táctica compleja tarda más en asimilarse (indicador Tactical Effectiveness). Dale al equipo unas semanas de entrenamiento o desactiva el modo avanzado.",
 c_simple_t:"Táctica sencilla",c_simple_b:"Solo {n} instrucciones cambiadas. El equipo la asimilará rápido.",
 c_medium_t:"Complejidad media",c_medium_b:"{n} instrucciones cambiadas. En unos partidos el equipo debería dominarla.",
 c_undPress_t:"Presión con un equipo modesto",c_undPress_b:"La presión alta cuesta mucha energía. Si encajas goles al final, cambia Line of Engagement a Mid Block.",

ngen, die sich widersprechen.",

 copyBm:"Lesezeichen-Code kopieren",bmCopied:"Lesezeichen-Code kopiert.",eachH:"Jedes Mal, wenn du eine Datei willst:",
 eachSteps:"<li>Klicke unten auf <b>Rezept kopieren</b>.</li><li>Öffne <span class=\"mono\">tactics.sortitoutsi.net</span> (mit „tactics.“ am Anfang, nicht das sortitoutsi.net-Forum) in einem separaten Tab und <b>melde dich an</b> (ohne Konto zuerst registrieren). Erst wenn du angemeldet bist, klicke auf das Lesezeichen <b>FM27 → Datei</b>.</li><li>Im erscheinenden Fenster das Rezept einfügen (Strg+V) und auf <b>.fmf-Datei erstellen</b> klicken. Die Datei landet in deinen Downloads.</li><li>Im Spiel: Taktikbildschirm → <b>Load Tactic</b> → heruntergeladene Datei wählen.</li>",
 copyRecipe:"Rezept kopieren",recipeCopied:"Kopiert. Öffne jetzt tactics.sortitoutsi.net in einem separaten Tab, melde dich an und klicke auf das Lesezeichen FM27 → Datei.",howSum:"So funktioniert's",
 howTxt:"Das Lesezeichen funktioniert nur auf tactics.sortitoutsi.net und nutzt dessen Taktik-Editor. Es nimmt ein offizielles FM27-Preset als Basis, überträgt die Einstellungen aus dem Rezept und meldet am Ende, ob alles geklappt hat. Die Seite begrenzt die Anzahl der Anfragen; bei mehreren Dateien hintereinander wartet das Lesezeichen und versucht es erneut – erstelle Dateien einzeln. FM27-Dateien dieser Seite sind noch nicht vollständig mit dem Spiel geprüft, vergleiche die Taktik nach dem Laden also mit dem Generator.",
 footer:"Daten: 90 offizielle FM27-Presets (Sports Interactive), ausgelesen über tactics.sortitoutsi.net, sowie Taktiktests aus der 5-tägigen FM27-Testversion. Rollen- und Anweisungsnamen sind wie im Spiel auf Englisch. Die Spiel-Engine ändert sich mit Updates – nimm das Ergebnis als soliden Ausgangspunkt und passe es nach 5–6 Spielen an deine Spieler an.",
 sub:"Basis: Preset {si} · Mentality {m}",tagTI:"Anweisungen",shapeIP:"Mit Ball: {f}",shapeOOP:"Gegen den Ball: {f} · {loe}",oopMove:"Gegen den Ball rückt er auf {p}.",
 mentDD:"Die Grundausrichtung des Teams, einstellbar neben dem Stil oben im Taktikbildschirm.",allDefault:"Alles auf Standardeinstellungen.",untouched:"Lass die übrigen {n} Anweisungen auf Standard.",advMark:"aus Tests",
 c_manyA_t:"Viele Spieler mit Aufgabe Attack",c_manyA_b:"{n} von 10 Feldspielern haben die Aufgabe Attack. Bei Ballverlust bleiben hinten nur wenige. In FM27-Tests funktionierte das nur mit zwei defensiven Mittelfeldspielern gegen den Ball.",
 c_balA_t:"Ausgewogener Angriff",c_balA_b:"{n} Spieler mit Aufgabe Attack. Presets von Sports Interactive haben meist 2–3, das Konterrisiko ist also im Griff.",
 c_fewD_t:"Wenige Verteidiger gegen den Ball",c_fewD_b:"Nur {n} Spieler haben gegen den Ball die Aufgabe Defend. Presets haben 5–8. Wähle unter dem Spielfeld eine andere Formation gegen den Ball.",
 c_gapOk_t:"Hohes Pressing mit tiefer Linie",c_gapOk_b:"Zwischen Pressing und Abwehr entsteht ein freier Raum. Ihn schließen {n} defensive Mittelfeldspieler gegen den Ball. Dieses Muster stammt aus den Tests der Testversion, nicht aus den SI-Presets.",
 c_gapBad_t:"Lücke zwischen Pressing und Abwehr",c_gapBad_b:"Hohes Pressing mit tiefer Abwehrlinie lässt dem Gegner viel Raum im Zentrum. Wähle eine Formation gegen den Ball mit zwei defensiven Mittelfeldspielern (2DM oder 4-2-2-2 DM).",
 c_highSK_t:"Hohe Abwehrlinie",c_highSK_b:"Du brauchst schnelle Innenverteidiger (Schnelligkeit und Antritt um 13+). Der Sweeper Keeper sichert Bälle hinter die Abwehr ab.",
 c_highNoSK_t:"Hohe Abwehrlinie",c_highNoSK_b:"Eine hohe Linie ohne Sweeper Keeper lässt Raum hinter der Abwehr. Stell die Rolle des Torwarts gegen den Ball auf Sweeper Keeper oder senke die Linie.",
 c_stamina_t:"Hohe körperliche Belastung",c_stamina_b:"Gegenpressing und hohes Tempo ermüden schnell, und in FM27 sinkt die Kondition schneller als früher. Plane Wechsel um die 60. Minute und rotiere den Kader.",
 c_noWidth_t:"Niemand sorgt für Breite",c_noWidth_b:"Eine enge Ausrichtung ohne Flügelspieler oder Wing-Back verstopft die Mitte. Setze auf einer Seite eine Winger- oder Wing-Back-Rolle.",
 c_complex_t:"Komplexe Taktik",c_complex_b:"{n} geänderte Anweisungen. In FM27 braucht eine komplexe Taktik länger, bis sie sitzt (Anzeige Tactical Effectiveness). Gib dem Team einige Wochen Training oder schalte den Expertenmodus aus.",
 c_simple_t:"Einfache Taktik",c_simple_b:"Nur {n} geänderte Anweisungen. Das Team verinnerlicht sie schnell.",
 c_medium_t:"Mittlere Komplexität",c_medium_b:"{n} geänderte Anweisungen. Nach ein paar Spielen sollte das Team sie beherrschen.",
 c_undPress_t:"Pressing mit einem schwächeren Team",c_undPress_b:"Hohes Pressing kostet viel Kraft. Kassierst du späte Tore, stell Line of Engagement auf Mid Block.",
 c_advOff_t:"Expertenmodus inaktiv",c_advOff_b:"Die Testergebnisse betreffen Pressingfußball und passen nicht zu einem defensiven Stil, deshalb wurden sie ausgelassen.",
 w_map:"Stil „{s}“, Angriff „{w}“: Am besten passt das offizielle Preset {si}.",y_narrow:"Ein enger Angriff schafft Überzahl im Zentrum und kurze Abstände zwischen den Spielern.",
 y_wide:"Angriffe über die Flügel ziehen die gegnerische Abwehr auseinander und öffnen Räume in der Mitte für nachrückende Spieler.",w_fav:"Als Favorit spielst du eine Mentalitätsstufe über dem Preset – Gegner werden tief stehen.",
 w_und:"Als schwächeres Team spielst du eine Mentalitätsstufe tiefer – weniger Risiko, weniger Gegentore.",w_adv:"Expertenmodus: Einstellungen aus den Taktiken, die in Tests (Testversion und Vollversion) am besten abschnitten, auch mit einem Mittelfeldteam. Orange Markierungen zeigen, was sie geändert haben.",

fr:{"scoreH": "Note de la tactique", "scoreShort": "note", "sc_coh": "Cohérence", "sc_fit": "Adéquation au moteur", "sc_def": "Équilibre défensif", "sc_sim": "Simplicité", "sc_coh_d": "Avertissements : {n}", "sc_fit_d": "{n} sur {m} réglages clés issus des tests", "sc_def_d": "Milieux défensifs sans ballon : {h} · Defend sans ballon : {d}", "sc_sim_d": "Consignes modifiées : {n}", "g_great": "Excellente", "g_good": "Bonne", "g_ok": "Moyenne", "g_risky": "Risquée", "tipAdv": "Vous voulez une meilleure note ? Activez le mode avancé : il améliore généralement l'adéquation au moteur.", "scoreNote": "Une estimation basée sur le contrôle de cohérence, la proximité avec les réglages qui ont dominé les tests de FM27, l'équilibre défensif et la complexité. Ce n'est pas une garantie de résultats : vos joueurs comptent aussi.", "supportShort": "Offrez-moi un café", "supportTitle": "Le générateur vous plaît ?", "supportTxt": "S'il vous a aidé à construire votre tactique, vous pouvez m'offrir un café. Cela me permet de continuer : mises à jour pour les nouvelles versions du moteur de match, plus d'entraîneurs et de nouvelles fonctions.", "byLabel": "par", "disclaimer": "Outil de fan non officiel. Sans lien avec Sports Interactive, SEGA ou tactics.sortitoutsi.net. Football Manager est une marque de ses propriétaires respectifs. Les styles des entraîneurs sont des interprétations de leur jeu dans les réglages de FM27, pas leurs tactiques officielles.", "fCoach": "0. Choix rapide : entraîneur préféré", "coachNone": "— aucun entraîneur, mes propres réglages —", "coachHint": "Règle la formation, le style et les détails dans l'esprit de l'entraîneur. Vous pouvez tout modifier ensuite.", "w_coach": "Inspiration : {name} – {desc}", "coachNote": "Il s'agit d'une interprétation du style de l'entraîneur dans les réglages de FM27, pas de sa tactique officielle.", "coachMark": "entraîneur", "subCoach": "Style : {name}", "eyebrow": "Football Manager 27 · briefing tactique", "h1": "Générateur de tactiques", "lead": "Choisissez une formation et un style de jeu. Le générateur associe rôles et consignes à partir des 90 presets officiels de FM27 de Sports Interactive, explique chaque choix et vous prévient des réglages incompatibles.", "fForm": "1. Formation", "fFormSmall": "(avec ballon)", "fStyle": "2. Style de jeu", "fWidth": "3. Où vous attaquez", "fLevel": "4. Niveau de l'équipe dans le championnat", "st_possession": "Possession", "st_press": "Attaque et pressing", "st_counter": "Contre-attaques", "st_direct": "Jeu direct", "st_defence": "Défense solide", "w_narrow": "Resserré, par l'axe", "w_balanced": "Mixte", "w_wide": "Par les ailes", "l_fav": "Favori", "l_mid": "Milieu de tableau", "l_und": "Outsider", "diamond": "4-4-2 losange", "advLabel": "Mode avancé : résultats des tests", "advDesc": "Ajoute les réglages qui ont dominé les tests de la version d'essai de FM27 : mentalité plus élevée, tempo rapide, pressing haut avec une ligne plus basse, attaque resserrée avec des latéraux qui rentrent dans l'axe. Peut cesser de fonctionner après une mise à jour du moteur de match.", "ip": "Avec ballon", "oop": "Sans ballon", "oopShape": "Dispositif sans ballon", "rolesH": "Rôles des joueurs", "thPos": "Poste", "checksH": "Contrôle de cohérence", "tiH": "Consignes d'équipe", "whyH": "Pourquoi ce dispositif", "watchH": "À surveiller lors des premiers matchs", "copyText": "Copier la tactique en texte", "copied": "Copié dans le presse-papiers.", "copyFb": "Le texte ci-dessous est sélectionné : copiez-le avec le raccourci clavier.", "fmfH": "Fichier .fmf à charger dans le jeu", "setupH": "Première fois uniquement : ajoutez le favori", "setupTxt": "Attrapez le bouton vert ci-dessous et <b>faites-le glisser sur la barre de favoris de votre navigateur</b>. Vous ne voyez pas la barre ? Affichez-la avec <b>Ctrl+Maj+B</b>.", "bmLabel": "FM27 → fichier", "bmHint": "← faites-le glisser, ne cliquez pas", "bmClick": "Faites-le glisser sur la barre de favoris ; cliquez dessus uniquement sur le site sortitoutsi.", "altSum": "Le glisser-déposer ne marche pas ? Ajoutez le favori à la main", "altSteps": "<li>Cliquez sur <b>Copier le code du favori</b>.</li><li>Clic droit sur la barre de favoris → <b>Ajouter une page</b> / <b>Ajouter un favori</b>.</li><li>Nom : <b>FM27 → fichier</b>, collez le code dans le champ <b>URL</b>, enregistrez.</li>", "copyBm": "Copier le code du favori", "bmCopied": "Code du favori copié.", "eachH": "À chaque fois que vous voulez un fichier :", "eachSteps": "<li>Cliquez sur <b>Copier la recette</b> ci-dessous.</li><li>Ouvrez <span class=\"mono\">tactics.sortitoutsi.net</span> (avec « tactics. » au début, pas le forum sortitoutsi.net) dans un autre onglet et <b>connectez-vous</b> (si vous n'avez pas de compte, inscrivez-vous d'abord). Une fois connecté seulement, cliquez sur le favori <b>FM27 → fichier</b>.</li><li>Dans la fenêtre qui s'ouvre, collez la recette (Ctrl+V) et cliquez sur <b>Créer le fichier .fmf</b>. Le fichier arrive dans votre dossier Téléchargements.</li><li>Dans le jeu : écran Tactiques → <b>Load Tactic</b> → choisissez le fichier téléchargé.</li>", "copyRecipe": "Copier la recette", "recipeCopied": "Copié. Ouvrez maintenant tactics.sortitoutsi.net dans un autre onglet, connectez-vous et cliquez sur le favori FM27 → fichier.", "howSum": "Comment ça marche", "howTxt": "Le favori fonctionne uniquement sur tactics.sortitoutsi.net et utilise son éditeur de tactiques. Il prend un preset officiel de FM27 comme base, y applique les réglages de la recette et vous indique à la fin si tout a fonctionné. Le site limite le nombre de requêtes : si vous créez plusieurs fichiers d'affilée, le favori attend et réessaie tout seul. Créez les fichiers un par un. Les fichiers FM27 de ce site ne sont pas encore entièrement vérifiés dans le jeu : après le chargement, comparez la tactique avec le générateur.", "footer": "Données : 90 presets officiels de FM27 (Sports Interactive) lus via tactics.sortitoutsi.net, plus des tests de tactiques de la version d'essai de 5 jours de FM27. Les noms des rôles et des consignes sont en anglais, comme dans le jeu. Le moteur de match évoluera avec les mises à jour : considérez le résultat comme une base solide et ajustez-le à vos joueurs après 5 à 6 matchs.", "sub": "Base : preset {si} · Mentalité {m}", "tagTI": "Consignes", "shapeIP": "Avec ballon : {f}", "shapeOOP": "Sans ballon : {f} · {loe}", "oopMove": "Sans ballon, se déplace en {p}.", "mentDD": "L'approche générale de l'équipe, réglée à côté du style en haut de l'écran Tactiques.", "allDefault": "Tout sur les réglages par défaut.", "untouched": "Laissez les {n} autres consignes par défaut.", "advMark": "des tests", "c_manyA_t": "Beaucoup de joueurs en Attack", "c_manyA_b": "{n} joueurs de champ sur 10 ont la tâche Attack. À la perte du ballon, il reste peu de monde derrière. Dans les tests de FM27, cela ne marchait qu'avec une paire de milieux défensifs sans ballon.", "c_balA_t": "Attaque équilibrée", "c_balA_b": "{n} joueurs en Attack. Les presets de Sports Interactive en ont en général 2 ou 3, le risque de contre-attaque est donc maîtrisé.", "c_fewD_t": "Peu de défenseurs sans ballon", "c_fewD_b": "Seulement {n} joueurs ont la tâche Defend sans ballon. Les presets en ont 5 à 8. Choisissez un autre dispositif sans ballon sous le terrain.", "c_gapOk_t": "Pressing haut avec une ligne basse", "c_gapOk_b": "Une zone libre s'ouvre entre le pressing et la défense. {n} milieux défensifs la ferment sans ballon. Ce schéma vient des tests de la version d'essai, pas des presets de SI.", "c_gapBad_t": "Trou entre le pressing et la défense", "c_gapBad_b": "Un pressing haut avec une ligne défensive basse laisse beaucoup d'espace à l'adversaire au milieu. Choisissez un dispositif sans ballon avec deux milieux défensifs (2DM ou 4-2-2-2 DM).", "c_highSK_t": "Ligne défensive haute", "c_highSK_b": "Il vous faut des défenseurs centraux rapides (Pace et Acceleration vers 13+). Le Sweeper Keeper couvre les ballons dans le dos.", "c_highNoSK_t": "Ligne défensive haute", "c_highNoSK_b": "Une ligne haute sans Sweeper Keeper laisse un espace vide derrière la défense. Passez le rôle du gardien sans ballon en Sweeper Keeper ou baissez la ligne.", "c_stamina_t": "Forte charge physique", "c_stamina_b": "Le contre-pressing et un tempo élevé fatiguent vite les joueurs, et dans FM27 la condition baisse plus vite qu'avant. Prévoyez des changements vers la 60e minute et faites tourner l'effectif.", "c_noWidth_t": "Personne n'apporte de largeur", "c_noWidth_b": "Un dispositif resserré sans ailier ni piston encombre l'axe. Ajoutez un rôle Winger ou Wing-Back sur un côté.", "c_complex_t": "Tactique complexe", "c_complex_b": "{n} consignes modifiées. Dans FM27, une tactique complexe met plus de temps à être assimilée (jauge Tactical Effectiveness). Laissez quelques semaines d'entraînement à l'équipe ou désactivez le mode avancé.", "c_simple_t": "Tactique simple", "c_simple_b": "Seulement {n} consignes modifiées. L'équipe l'assimilera vite.", "c_medium_t": "Complexité moyenne", "c_medium_b": "{n} consignes modifiées. Quelques matchs et l'équipe devrait la maîtriser.", "c_undPress_t": "Pressing avec une équipe plus faible", "c_undPress_b": "Un pressing haut coûte beaucoup d'énergie. Si vous encaissez des buts en fin de match, passez Line of Engagement sur Mid Block.", "c_advOff_t": "Mode avancé inactif", "c_advOff_b": "Les résultats des tests concernent un football de pressing et ne conviennent pas à un style défensif : ils n'ont donc pas été appliqués.", "w_map": "Style « {s} », attaque « {w} » : le preset officiel {si} est le plus adapté.", "y_narrow": "Une attaque resserrée vous donne le surnombre au milieu et des distances courtes entre les joueurs.", "y_wide": "Attaquer par les ailes étire la défense adverse et ouvre de l'espace dans l'axe pour les joueurs qui plongent.", "w_fav": "En tant que favori, vous jouez une mentalité au-dessus du preset : l'adversaire va défendre bas.", "w_und": "En tant qu'équipe plus faible, vous jouez une mentalité en dessous : moins de risques, moins de buts encaissés.", "w_adv": "Mode avancé : réglages des tactiques qui ont le mieux réussi dans les tests (version d'essai et jeu complet), y compris avec une équipe de milieu de tableau. Les étiquettes orange montrent ce qu'ils ont changé.", "w_shape": "Sans ballon, l'équipe passe de {a} à {b}.", "w_hold": " {n} joueurs protègent la défense.", "w_borrow": "Le style {si} n'a pas de preset officiel en {f}. Les rôles viennent du style le plus proche ({src}), les consignes d'équipe de {si}.", "w_template": "Le 4-4-2 à plat n'a pas de preset de Sports Interactive. Les rôles viennent d'un modèle basé sur la tactique testée WARRIOR, les consignes d'équipe de {si}.", "watchAdv": "Si l'adversaire exploite l'espace entre votre pressing et votre défense : dans ce cas, remontez Defensive Line d'un cran.", "txtTitle": "TACTIQUE FM27", "txtRoles": "RÔLES", "txtRest": "Autres consignes : par défaut."},
zh:{"scoreH": "战术评分", "scoreShort": "评分", "sc_coh": "一致性", "sc_fit": "比赛引擎适配度", "sc_def": "防守平衡", "sc_sim": "简洁度", "sc_coh_d": "警告：{n}", "sc_fit_d": "测试得出的 {m} 项关键设置中符合 {n} 项", "sc_def_d": "无球时的防守型中场：{h} · 无球时 Defend：{d}", "sc_sim_d": "修改的指令：{n}", "g_great": "优秀", "g_good": "良好", "g_ok": "一般", "g_risky": "有风险", "tipAdv": "想要更高的评分？打开高级模式，它通常能提高比赛引擎适配度。", "scoreNote": "这是一个估算，依据一致性检查、战术与 FM27 测试中表现突出的设置的接近程度、防守平衡和复杂度。它不能保证比赛结果，你的球员同样重要。", "supportShort": "请我喝杯咖啡", "supportTitle": "喜欢这个生成器吗？", "supportTxt": "如果它帮你搭建了战术，可以请我喝杯咖啡。这能让我继续更新：适配新版比赛引擎、加入更多教练和新功能。", "byLabel": "作者", "disclaimer": "非官方的粉丝工具。与 Sports Interactive、SEGA 或 tactics.sortitoutsi.net 无关。Football Manager 是其各自所有者的商标。教练风格是对其打法在 FM27 设置中的诠释，并非他们的官方战术。", "fCoach": "0. 快速选择：喜欢的教练", "coachNone": "— 不选教练，使用我的设置 —", "coachHint": "按照教练的理念设置阵型、风格和细节。之后可以随意修改。", "w_coach": "灵感来源：{name}——{desc}", "coachNote": "这是在 FM27 设置范围内对该教练风格的诠释，并非他的官方战术。", "coachMark": "教练", "subCoach": "风格：{name}", "eyebrow": "Football Manager 27 · 战术简报", "h1": "战术生成器", "lead": "选择阵型和比赛风格。生成器根据 Sports Interactive 的 90 套 FM27 官方预设匹配角色和指令，解释每个决定，并提醒你相互冲突的设置。", "fForm": "1. 阵型", "fFormSmall": "（持球时）", "fStyle": "2. 比赛风格", "fWidth": "3. 进攻方向", "fLevel": "4. 球队在联赛中的实力", "st_possession": "控球", "st_press": "进攻与压迫", "st_counter": "防守反击", "st_direct": "直接打法", "st_defence": "稳固防守", "w_narrow": "收窄，走中路", "w_balanced": "混合", "w_wide": "走边路", "l_fav": "强队", "l_mid": "中游球队", "l_und": "弱队", "diamond": "4-4-2 菱形", "advLabel": "高级模式：测试结论", "advDesc": "加入在 FM27 试玩版测试中表现突出的设置：更高的心态、快节奏、高位压迫配合更深的防线、收窄进攻并让边后卫内收。比赛引擎更新后可能失效。", "ip": "持球时", "oop": "无球时", "oopShape": "无球阵型", "rolesH": "球员角色", "thPos": "位置", "checksH": "一致性检查", "tiH": "球队指令", "whyH": "为什么这样设置", "watchH": "前几场比赛要关注什么", "copyText": "以文本形式复制战术", "copied": "已复制到剪贴板。", "copyFb": "下方文本已选中，请用键盘快捷键复制。", "fmfH": "可在游戏中载入的 .fmf 文件", "setupH": "仅第一次：添加书签", "setupTxt": "按住下方的绿色按钮，<b>把它拖到浏览器的书签栏上</b>。看不到书签栏？按 <b>Ctrl+Shift+B</b> 显示。", "bmLabel": "FM27 → 文件", "bmHint": "← 拖动它，不要点击", "bmClick": "把它拖到书签栏上；只在 sortitoutsi 网站上点击它。", "altSum": "拖不动？手动添加书签", "altSteps": "<li>点击<b>复制书签代码</b>。</li><li>在书签栏上右键 → <b>添加网页</b> / <b>添加书签</b>。</li><li>名称：<b>FM27 → 文件</b>，把代码粘贴到<b>网址</b>栏，然后保存。</li>", "copyBm": "复制书签代码", "bmCopied": "书签代码已复制。", "eachH": "每次需要文件时：", "eachSteps": "<li>点击下方的<b>复制配方</b>。</li><li>在新标签页中打开 <span class=\"mono\">tactics.sortitoutsi.net</span>（开头是“tactics.”，不是 sortitoutsi.net 论坛）并<b>登录</b>（没有账号请先注册）。登录后再点击 <b>FM27 → 文件</b> 书签。</li><li>在弹出的窗口中粘贴配方（Ctrl+V），点击<b>生成 .fmf 文件</b>。文件会保存到你的下载文件夹。</li><li>在游戏中：战术界面 → <b>Load Tactic</b> → 选择下载的文件。</li>", "copyRecipe": "复制配方", "recipeCopied": "已复制。现在在新标签页中打开 tactics.sortitoutsi.net，登录后点击 FM27 → 文件 书签。", "howSum": "工作原理", "howTxt": "书签只能在 tactics.sortitoutsi.net 上使用，它会调用该网站的战术编辑器。它以一套 FM27 官方预设为基础，套用配方中的设置，最后告诉你是否全部成功。网站会限制请求次数，所以连续生成多个文件时，书签会自动等待并重试。请一次只生成一个文件。该网站生成的 FM27 文件尚未在游戏中完全验证，载入后请对照生成器检查战术。", "footer": "数据：通过 tactics.sortitoutsi.net 读取的 90 套 FM27 官方预设（Sports Interactive），以及 FM27 五天试玩版中的战术测试。角色和指令名称保留英文，与游戏一致。比赛引擎会随更新变化，请把结果当作可靠的起点，5–6 场比赛后再根据你的球员微调。", "sub": "基础：{si} 预设 · 心态 {m}", "tagTI": "指令", "shapeIP": "持球时：{f}", "shapeOOP": "无球时：{f} · {loe}", "oopMove": "无球时移到 {p}。", "mentDD": "球队的整体取向，在战术界面顶部风格旁边设置。", "allDefault": "全部使用默认设置。", "untouched": "其余 {n} 项指令保持默认。", "advMark": "来自测试", "c_manyA_t": "Attack 职责的球员过多", "c_manyA_b": "10 名场上球员中有 {n} 名是 Attack 职责。丢球后后场留下的人很少。在 FM27 测试中，只有无球时配备两名防守型中场才奏效。", "c_balA_t": "进攻平衡", "c_balA_b": "{n} 名球员是 Attack 职责。Sports Interactive 的预设通常是 2–3 名，因此被反击的风险可控。", "c_fewD_t": "无球时防守人数太少", "c_fewD_b": "无球时只有 {n} 名球员是 Defend 职责。预设通常有 5–8 名。请在球场下方选择其他无球阵型。", "c_gapOk_t": "高位压迫配合深防线", "c_gapOk_b": "压迫线与防线之间会出现空档。无球时由 {n} 名防守型中场填补。这种模式来自试玩版测试，而不是 SI 的预设。", "c_gapBad_t": "压迫与防线之间有空档", "c_gapBad_b": "高位压迫配合低防线，会在中场给对手留下大量空间。请选择有两名防守型中场的无球阵型（2DM 或 4-2-2-2 DM）。", "c_highSK_t": "高防线", "c_highSK_b": "你需要速度快的中后卫（Pace 和 Acceleration 约 13 以上）。Sweeper Keeper 会处理打身后的球。", "c_highNoSK_t": "高防线", "c_highNoSK_b": "没有 Sweeper Keeper 的高防线会在身后留下空当。把门将的无球角色改为 Sweeper Keeper，或降低防线。", "c_stamina_t": "体能负担重", "c_stamina_b": "反抢和高节奏会让球员很快疲劳，而且 FM27 中体能下降比以前更快。计划在第 60 分钟左右换人，并轮换阵容。", "c_noWidth_t": "没人拉开宽度", "c_noWidth_b": "收窄的阵型如果没有边锋或翼卫，中路会挤成一团。在一侧加入 Winger 或 Wing-Back 角色。", "c_complex_t": "战术较复杂", "c_complex_b": "修改了 {n} 项指令。在 FM27 中，复杂的战术需要更长时间磨合（Tactical Effectiveness 指标）。给球队几周训练时间，或关闭高级模式。", "c_simple_t": "战术简单", "c_simple_b": "只修改了 {n} 项指令。球队会很快掌握。", "c_medium_t": "中等复杂度", "c_medium_b": "修改了 {n} 项指令。几场比赛后球队应该就能掌握。", "c_undPress_t": "弱队打压迫", "c_undPress_b": "高位压迫非常消耗体能。如果比赛末段常丢球，把 Line of Engagement 改为 Mid Block。", "c_advOff_t": "高级模式未启用", "c_advOff_b": "测试结论针对压迫型足球，不适合防守风格，因此没有套用。", "w_map": "风格“{s}”，进攻方向“{w}”：最合适的是官方 {si} 预设。", "y_narrow": "收窄进攻让你在中场形成人数优势，球员之间距离更近。", "y_wide": "边路进攻能拉开对方防线，为中路插上的球员创造空间。", "w_fav": "作为强队，你的心态比预设高一档，对手会龟缩防守。", "w_und": "作为弱队，你的心态比预设低一档：风险更小，失球更少。", "w_adv": "高级模式：采用在测试（试玩版和正式版）中表现最好的战术的设置，中游球队同样适用。橙色标签显示它们改动了什么。", "w_shape": "无球时球队从 {a} 变为 {b}。", "w_hold": "由 {n} 名球员保护防线。", "w_borrow": "{si} 风格在 {f} 阵型下没有官方预设。角色取自最接近的风格（{src}），球队指令取自 {si}。", "w_template": "平行 4-4-2 没有 Sports Interactive 的预设。角色取自基于已测试战术 WARRIOR 的模板，球队指令取自 {si}。", "watchAdv": "留意对手是否利用你的压迫线与防线之间的空间。如果是，把 Defensive Line 提高一档。", "txtTitle": "FM27 战术", "txtRoles": "角色", "txtRest": "其他指令：默认。"}

/* ======================= JĘZYK ======================= */
let LANG="en";
try{const s=localStorage.getItem("fm27lang"); if(LANGS.includes(s)) LANG=s;}catch(e){}
const LI=()=>LANGS.indexOf(LANG);
const t=(k,p)=>{let s=I18N[LANG][k]; if(s==null) s=I18N.en[k]; if(s==null) s=k; if(p) s=s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m); return s;};
const formLabel=F=>F.label||t(F.id);
const posName=p=>(POS_NAME[p]||[])[LI()]||p;
const roleDesc=r=>(ROLE[r]||[])[1+LI()]||"";
const tiExpl=x=>x[6][LI()];

/* ======================= LOGIKA ======================= */
function parse(row,src){
  return {src, si:row[0], ip:row[1], oop:row[2],
    players:row[4].split(" ").map(s=>{const a=s.split(",");return {ip:{pos:a[0],role:ROLES[+a[1]],duty:a[2],pi:[]},oop:{pos:a[3],role:ROLES[+a[4]],duty:a[5],pi:[]}}})};
}
const ALL=P.map(r=>parse(r,"preset")).concat(TEMPLATES.map(r=>parse(r,"template")));

let oopChoice=null;

/* Kontrola spójności + ocena 0-100. Wspólna dla taktyk z generatora i taktyk ocenianych z pliku. */
const eqv=(a,b)=>String(a||"").toLowerCase()===String(b||"").toLowerCase();
function scoreTactic(players,ti,ment,level){
  const chk=[];
  const ipA=players.filter(p=>p.ip.duty==="A"&&p.ip.pos!=="GK").length;
  const oopD=players.filter(p=>p.oop.duty==="D"&&p.oop.pos!=="GK").length;
  const holders=players.filter(isHolder).length;
  const nonDef=TI.filter(x=>ti[x[0]]!==undefined&&!eqv(ti[x[0]],DEF[x[0]])).length;
  const loe=ti["line-of-engagement"], dl=ti["defensive-line"];
  chk.push(ipA>=6?[holders>=2?"info":"warn","c_manyA",{n:ipA}]:["ok","c_balA",{n:ipA}]);
  if(oopD<4) chk.push(["warn","c_fewD",{n:oopD}]);
  if(loe==="High Press" && /Lower/.test(dl)) chk.push(holders>=2?["info","c_gapOk",{n:holders}]:["warn","c_gapBad",{}]);
  if(/Higher/.test(dl)){const sk=players.find(p=>p.oop.pos==="GK").oop.role==="Sweeper Keeper"; chk.push(sk?["info","c_highSK",{}]:["warn","c_highNoSK",{}]);}
  if(ti["defensive-transition"]==="Counter-Press" && /Higher/.test(ti["tempo"])) chk.push(["info","c_stamina",{}]);
  if(ti["attacking-width"].includes("Narrower") && !players.some(p=>/Winger|Wing-Back|Wide Midfielder/.test(p.ip.role)||p.ip.pi.some(x=>/Stay Wider|STAY_WIDER/.test(x)))) chk.push(["warn","c_noWidth",{}]);
  chk.push(nonDef>18?["info","c_complex",{n:nonDef}]:nonDef<=12?["ok","c_simple",{n:nonDef}]:["ok","c_medium",{n:nonDef}]);
  if(level==="und" && loe==="High Press") chk.push(["info","c_undPress",{}]);
  /* Ocena 0-100 */
  /* Kalibracja 11.2026: dane z triala i pełnej wersji. Liczy się kształt bez piłki, nie liczba zadań Attack z piłką (ARGUS: 9× Attack, 1. miejsce w teście mid-table). */
  const META={"tempo":"Much Higher","attacking-width":"Much Narrower","dribbling":"Encourage","shots-from-distance":"Discourage","crossing-style":"Low Crosses","defensive-transition":"Counter-Press","line-of-engagement":"High Press","trigger-press":"Much More Often","tackling":"Get Stuck In","prevent-short-gk-distribution":"Yes","cross-engagement":"Invite Crosses",
    "passing-directness":"More Direct","build-up-strategy":"Play Through Press","pass-reception":"Pass Into Space","patience":"Work Ball Into Box","attacking-transition":"Counter-Attack","defensive-line":"Much Lower"};
  const metaN=Object.keys(META).length;
  const warns=chk.filter(x=>x[0]==="warn").length;
  const metaHits=Object.entries(META).filter(([k,v])=>eqv(ti[k],v)).length;
  const mentPts=[0,0,0,1,3,4,5][MENT.indexOf(ment)];
  const sCoh=Math.max(0,30-10*warns);
  const sFit=Math.round(25*metaHits/metaN+(holders>=2?5:0)+mentPts);
  const sHold=holders>=2?10:holders===1?(ipA<=5?7:4):(ipA<=4?6:ipA<=5?3:0);
  const sDef=sHold+(oopD>=6?10:oopD===5?8:oopD===4?5:0);
  const sSim=nonDef<=12?15:nonDef<=18?13:nonDef<=24?10:6;
  const score={total:sCoh+sFit+sDef+sSim,parts:[["sc_coh",sCoh,30,{n:warns}],["sc_fit",sFit,35,{n:metaHits,m:metaN}],["sc_def",sDef,20,{a:ipA,d:oopD,h:holders}],["sc_sim",sSim,15,{n:nonDef}]]};
  return {chk,score,holders,nonDef};
}
/* Taktyka z tactics.sortitoutsi.net (model z /api/shared) -> ocena */
function rateModel(m){
  const D={Attack:"A",Support:"S",Defend:"D"};
  const ph=x=>({pos:x.position,role:x.role,duty:D[x.duty]||x.duty||"S",pi:x.playerInstructions||[]});
  const players=m.players.filter(p=>p.enabled!==false).map(p=>({ip:ph(p.phases.inPossession),oop:ph(p.phases.outOfPossession)}));
  const ti=Object.fromEntries(m.teamInstructions.settings.map(x=>[x.id,x.value]));
  const ment=MENT.find(x=>eqv(x,m.mentality.name))||"Balanced";
  return {name:m.name,ment,f:m.formations,...scoreTactic(players,ti,ment,"mid")};
}
function build(c){
  const F=FORMATIONS.find(f=>f.id===c.form);
  const si=MAP[c.style][c.width];
  const notes=[];
  let pool=ALL.filter(x=>x.src==="preset"&&x.si===si&&x.ip===F.ip), srcSi=si, borrowed=false;
  if(!pool.length){
    pool=ALL.filter(x=>x.src==="template"&&x.ip===F.ip);
    if(pool.length){borrowed=true;srcSi=null;}
    else{for(const s of NEAR[si]){const p=ALL.filter(x=>x.src==="preset"&&x.si===s&&x.ip===F.ip);if(p.length){pool=p;srcSi=s;borrowed=true;break;}}}
  }
  const defensive=DEFENSIVE_SI.includes(si);
  const advOn=c.adv && !defensive;
  let variant=pool.find(x=>x.oop===oopChoice);
  if(!variant){
    if(advOn) variant=pool.slice().sort((a,b)=>b.players.filter(isHolder).length-a.players.filter(isHolder).length)[0];
    else variant=pool[0];
  }
  const tac=clone(variant);
  if(borrowed){
    const g=GK_BY_SI[si], gk=tac.players.find(p=>p.ip.pos==="GK");
    gk.ip.role=g[0];gk.ip.duty=g[1];gk.oop.role=g[2];gk.oop.duty=g[3];
    notes.push(srcSi?["w_borrow",{si:SI_NAME[si],f:"@F",src:SI_NAME[srcSi]}]:["w_template",{si:SI_NAME[si]}]);
  }
  const ti={...DEF,...STYLE[si].ti};
  const advKeys=new Set();
  if(c.width==="narrow"){
    if(!/Narrower/.test(ti["attacking-width"])) ti["attacking-width"]="Narrower";
    if(ti["progress-through"]==="Balanced") ti["progress-through"]="Middle";
    if(ti["crossing-style"]==="Balanced") ti["crossing-style"]="Low Crosses";
  }else if(c.width==="wide"){
    if(ti["attacking-width"]!=="Much Wider") ti["attacking-width"]="Wider";
    ti["progress-through"]="Both Flanks";
    if(ti["crossing-style"]==="Low Crosses") ti["crossing-style"]="Balanced";
  }
  if(advOn) ADV_TI.forEach(([k,v,skip])=>{ if(!skip(c) && ti[k]!==v){ti[k]=v;advKeys.add(k);} });
  let mi=MENT.indexOf(STYLE[si].ment);
  if(c.level==="fav") mi++; if(c.level==="und") mi--;
  if(advOn) mi++;
  mi=Math.max(1,Math.min(5,mi));
  const ment=MENT[mi];
  const players=tac.players;
  if(advOn){
    players.forEach(p=>{
      if(p.ip.pos==="GK"){p.ip.role="Ball-Playing Goalkeeper";p.ip.duty="S";p.oop.role="Sweeper Keeper";p.oop.duty="A";}
      if(/^DC/.test(p.ip.pos) && /^(Centre-Back|No-Nonsense Centre-Back)$/.test(p.ip.role)){p.ip.role="Ball-Playing Centre-Back";p.ip.duty="D";}
      if(/^D[RL]$/.test(p.ip.pos) && /^(Full-Back|Wing-Back)$/.test(p.ip.role) && c.width!=="wide")
        p.ip.pi=["Attacking Width: Sit Narrower","Dribbling Direction: Cut Inside With Ball","Passing Risks: Take More Risks","Cross From: Byline"];
      if(/^(AM[RL]|M[RL])$/.test(p.ip.pos) && /^(Winger|Inside Winger|Inside Forward|Wide Forward|Wide Midfielder)$/.test(p.ip.role))
        p.ip.pi=["Attacking Width: Stay Wider"];
    });
    /* Trójka z tyłu jak ARGUS (najlepszy wynik w teście mid-table): wysuwający się boczni stoperzy i wąscy wahadłowi */
    if(players.some(p=>p.ip.pos==="DC") && players.some(p=>p.ip.pos==="DCL") && players.some(p=>p.ip.pos==="DCR")){
      players.forEach(p=>{
        if(/^DC[LR]$/.test(p.ip.pos)){p.ip.role="Overlapping Centre-Back";p.ip.duty="A";p.ip.pi=["Passing Risks: Take More Risks"];}
        if(p.ip.pos==="DC"){p.ip.role="Ball-Playing Centre-Back";p.ip.duty="D";}
        if(/^WB[RL]$/.test(p.ip.pos)){p.ip.role="Advanced Wing-Back";p.ip.duty="A";p.ip.pi=["Cross From: Byline","Shooting: Shoot Less Often"].concat(c.width!=="wide"?["Attacking Width: Sit Narrower"]:[]);}
      });
    }
  }
  const coach=c.coach?COACHES.find(x=>x.id===c.coach):null;
  const coachKeys=new Set();
  if(coach){
    Object.entries(coach.ti).forEach(([k,v])=>{ if(ti[k]!==v){ti[k]=v;coachKeys.add(k);advKeys.delete(k);} });
    coach.roles.forEach(([pos,role,duty])=>{const p=players.find(x=>x.ip.pos===pos); if(p){p.ip.role=role;p.ip.duty=duty;p.coach=true;}});
  }
  const {chk,score,holders,nonDef}=scoreTactic(players,ti,ment,c.level);
  if(c.adv && defensive) chk.push(["info","c_advOff",{}]);
  return {c,F,si,variant,pool,players,ti,advKeys,coachKeys,coach,ment,chk,notes,holders,nonDef,advOn,borrowed,score};
}

  var R0;
  try{R0=JSON.parse(atob(String(raw).trim().replace(/^FM27GEN1:/,"")));}catch(e){return T.badRecipe;}
  var wait=function(ms){return new Promise(function(z){setTimeout(z,ms);});};
  var J=async function(u,o){for(var a=0;a<6;a++){var r=await fetch(u,o);var j=await r.json().catch(function(){return {};});if(r.status===401)throw new Error(T.login);if(r.status===404)throw new Error(T.notSite);if(r.status===429||j.error==="rate_limited"){await wait(3000*(a+1));continue;}if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;}throw new Error(T.rate);};
  var ALLP=["GK","DR","DL","DC","DCL","DCR","WBR","WBL","DM","DML","DMR","MR","ML","MC","MCL","MCR","AMR","AML","AMC","AMCL","AMCR","STC","STCL","STCR"];
  var ex=(await J("/api/examples")).filter(function(e){return e.section==="FM27 Presets"&&e.group===R0.base.g;});
  var t=null;
  for(var e of ex){var x=(await J("/api/tactic/example?path="+encodeURIComponent(e.path))).tactic;if(x.model.formations.inPossession===R0.base.ip&&x.model.formations.outOfPossession===R0.base.oop){t=x;break;}}
  if(!t)return T.noBase+R0.base.g+" "+R0.base.ip+" / "+R0.base.oop;
  var S=t.state,C=t.container,M=t.model,errs=[];
  var E=async function(op){try{var j=await J("/api/tactic/edit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({state:S,op:op,container:C})});S=j.state;C=j.container;M=j.model;return true;}catch(err){errs.push(op.type+" "+(op.setting||op.role||op.position||"")+": "+err.message);return false;}};
  var prog=opts.onProgress||function(){};
  prog(T.pName);
  await E({type:"rename",name:R0.name});
  await E({type:"mentality",value:R0.ment});
  var ti=0,tn=Object.keys(R0.ti).length;
  for(var k in R0.ti){ti++;prog(T.pTi+ti+T.of+tn);await E({type:"teamInstruction26",setting:k,value:R0.ti[k]});}
  for(var ph of ["in","out"]){
    var key=ph==="in"?"inPossession":"outOfPossession";
    prog(ph==="in"?T.pIn:T.pOut);
    for(var guard=0;guard<60;guard++){
      var cur=M.players.map(function(p){return p.phases[key].position;});
      var todo=R0.p.map(function(q,i){return i;}).filter(function(i){return cur[i]!==R0.p[i][ph].pos;});
      if(!todo.length)break;
      var moved=false;
      for(var i of todo){var tgt=R0.p[i][ph].pos;if(cur.indexOf(tgt)<0){moved=await E({type:"position26",player:i,phase:ph,position:tgt});if(moved)break;}}
      if(!moved){var bi=cur.indexOf(R0.p[todo[0]][ph].pos);var free=ALLP.filter(function(f){return f!=="GK"&&cur.indexOf(f)<0;});
        var ok=false;for(var f of free){ok=await E({type:"position26",player:bi,phase:ph,position:f});if(ok)break;}
        if(!ok)break;}
    }
    for(var n=0;n<R0.p.length;n++){var q=R0.p[n][ph];
      if(M.players[n].phases[key].role!==q.role)await E({type:"role26",player:n,phase:ph,role:q.role});
      for(var pi of q.pi){await E({type:"playerInstruction26",player:n,phase:ph,setting:pi[0],value:pi[1]});}}
  }
  var bad=[];
  R0.p.forEach(function(q,n){["in","out"].forEach(function(ph){var a=M.players[n].phases[ph==="in"?"inPossession":"outOfPossession"];if(a.position!==q[ph].pos||a.role!==q[ph].role)bad.push((ph==="in"?T.ip:T.oop)+": "+q[ph].pos+" "+q[ph].role+" ("+T.is+": "+a.position+" "+a.role+")");});});
  prog(T.pDl);
  var d;
  for(var a2=0;a2<6;a2++){d=await fetch("/api/tactic/download",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({state:S,name:R0.name,container:C})});if(d.status!==429)break;await wait(3000*(a2+1));}
  if(d.status===401)return T.login;
  if(!d.ok)return T.dlFail+d.status+").";
  var blob=await d.blob();
  if(opts.returnBlob)return {blob:blob,errs:errs,bad:bad,model:M};
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=R0.name+".fmf";document.body.appendChild(a);a.click();a.remove();
  return T.done.replace("{name}",R0.name)+"\n("+M.formations.inPossession+" / "+M.formations.outOfPossession+")\n\n"+T.hint+
    (bad.length?"\n\n"+T.bad+"\n- "+bad.join("\n- "):"")+
    (errs.length?"\n\n"+T.skipped+" ("+errs.length+"):\n- "+errs.slice(0,8).join("\n- "):"");
}
