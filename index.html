<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="barfly86">
<meta name="description" content="FM27 tactic generator by barfly86: pick a formation and playing style or your favourite manager and get a complete FM27 tactic with roles, instructions and a ready .fmf file. EN / PL / ES / DE.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316695e'/%3E%3Crect x='10' y='8' width='44' height='48' rx='3' fill='none' stroke='%232fd3a7' stroke-width='3'/%3E%3Cline x1='10' y1='32' x2='54' y2='32' stroke='%232fd3a7' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='none' stroke='%232fd3a7' stroke-width='3'/%3E%3C/svg%3E">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FM27 Tactic Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ekran taktyki FM27 — granatowo-fioletowe tło, turkusowe pasy nagłówków, znaczniki zawodników w kolorach linii */
:root{
  --bg:#0e0b24; --glow:rgba(110,60,220,.28); --surface:#1a1644; --surface-2:#221c56; --line:#352f70;
  --band:#16695e; --band-2:#1d8574; --ink:#eef0fa; --muted:#a8abd0;
  --accent:#2fd3a7; --accent-ink:#052a21; --oop:#f5a524;
  --warn-bg:#3b2a12; --warn-ink:#ffd27f; --ok-bg:#0f3a31; --ok-ink:#86ecc9; --info-bg:#1f2759; --info-ink:#b3c3ff;
  --pitch:#1c5b3c; --pitch-2:#195335; --chalk:rgba(255,255,255,.5);
  --lGK:#5d6b88; --lD:#178f6c; --lM:#2f9a52; --lAM:#7446d6; --lST:#c21f78;
  --dD:#5b9bff; --dS:#f0d050; --dA:#ff5d73;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 520px at 8% -8%,var(--glow),transparent 70%),radial-gradient(900px 500px at 100% 0,rgba(22,105,94,.22),transparent 70%),var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1260px;margin:0 auto;display:grid;gap:24px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:grid;gap:6px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,54px);line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:0;color:var(--muted);max-width:70ch}
.bmc{display:inline-flex;align-items:center;gap:8px;background:#ffdd00;color:#1b1400;font:700 14px var(--f-body);text-decoration:none;border-radius:999px;padding:8px 16px;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s}
.bmc:hover{transform:translateY(-1px)}
.bmc:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bmc.big{font-size:16px;padding:12px 22px;white-space:nowrap}
.card.support{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;border:2px solid #ffdd00;background:linear-gradient(120deg,var(--surface),rgba(255,221,0,.08))}
.card.support > div{min-width:0;flex:1 1 320px}
.hdr-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{font:600 14px var(--f-body);letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:8px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--band);color:#fff}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}

.grid{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:940px){.grid{grid-template-columns:minmax(0,1fr)}}
form{display:grid;gap:18px;position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
@media (max-width:940px){form{position:static}}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;font-size:15px;padding:0;margin-bottom:8px;letter-spacing:.02em}
legend small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:7px 11px;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s}
.chips label:hover{border-color:var(--band-2)}
.chips input:checked+label{background:var(--band);border-color:var(--accent);color:#fff;font-weight:600}
.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.chips.big label{padding:9px 13px;font-size:15px}
.coachbox select{font:600 15px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--band-2);border-radius:8px;padding:10px 12px;width:100%;cursor:pointer}
.coachbox select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{margin:0;font-size:13px;color:var(--muted)}
dt .coach-mark{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:#c9b6ff;border:1px solid #9b7bff;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.pis.coach{color:#c9b6ff}
.adv{border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;background:var(--bg)}
.adv label.sw{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600;font-size:15px}
.adv input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.adv p{margin:0;font-size:13px;color:var(--muted)}

.result{display:grid;gap:22px;min-width:0}
.headline{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--band),var(--band-2));border-radius:10px;padding:14px 18px;color:#fff}
.headline .name{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1;text-transform:uppercase;letter-spacing:.02em}
.headline .sub{font-size:14.5px;opacity:.9}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:3px 7px;background:rgba(0,0,0,.18);color:#fff}
.tag b{font-weight:500;opacity:.75;margin-right:4px}

.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:1120px){.board{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.toggle button{font:600 14px var(--f-body);border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--band);color:#fff}
.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.shape-caption{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
svg.pitch{width:100%;max-width:520px;height:auto;display:block;border-radius:8px;margin:0 auto}
.pl{transition:transform .6s cubic-bezier(.5,0,.2,1)}
@media (prefers-reduced-motion:reduce){.pl{transition:none}}
.variants .chips label{font-size:13px;padding:5px 9px;font-family:var(--f-mono)}

.tablebox{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.pos{white-space:nowrap}
td.pos b{display:inline-block;font-family:var(--f-display);font-size:15px;color:#fff;border-radius:4px;padding:1px 7px;margin-bottom:3px}
td.pos span{display:block;font-size:12px;color:var(--muted)}
.role{font-weight:600}
.duty{font-family:var(--f-mono);font-size:11px;border-radius:3px;padding:1px 5px;margin-left:5px;color:#111;vertical-align:1px;font-weight:500}
.duty.D{background:var(--dD)} .duty.S{background:var(--dS)} .duty.A{background:var(--dA)}
.desc{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.pis{display:block;font-size:12.5px;font-family:var(--f-mono);color:var(--accent);margin-top:2px}
.ph{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ph.ip{background:var(--accent)} .ph.oop{background:var(--oop)}

.instr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.instr{grid-template-columns:minmax(0,1fr)}}
.card h3.band{background:var(--band);color:#fff;margin:-16px -16px 4px;padding:9px 16px;border-radius:12px 12px 0 0}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:4px;border-top:1px solid var(--line);padding-top:8px}
.grp:first-of-type{border-top:0;padding-top:0}
dl{margin:0;display:grid;gap:8px}
dl div{display:grid;gap:1px}
dt{font-size:14px;font-weight:600}
dt .val{color:var(--accent)}
dt .adv-mark{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--oop);border:1px solid var(--oop);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
dd{margin:0;font-size:13px;color:var(--muted)}
.untouched{font-size:13px;color:var(--muted);margin:8px 0 0}

.checks{display:grid;gap:8px}
.chk{border-radius:8px;padding:10px 14px;font-size:14.5px;display:grid;gap:2px;border-left:4px solid currentColor}
.chk strong{font-weight:700}
.chk.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chk.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chk.info{background:var(--info-bg);color:var(--info-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 14px var(--f-body);letter-spacing:.02em;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:9px 16px;cursor:pointer}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent)}
.copied{font-size:13px;color:var(--muted)}
textarea.fb{width:100%;min-height:150px;font-family:var(--f-mono);font-size:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;word-break:break-all}
.fmf{border:2px solid var(--band-2)}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.mono{font-family:var(--f-mono);font-size:13px}
details{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--accent)}
details[open] summary{margin-bottom:8px}
details.alt{border-top:0;padding-top:0}
.note{margin:0;font-size:13px;color:var(--muted)}
a.bm{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-decoration:none;padding:11px 18px;border-radius:8px;cursor:grab;border:2px dashed var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
a.bm:active{cursor:grabbing}
a.bm:focus-visible{outline:2px solid #fff;outline-offset:3px}
.setup{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
footer{font-size:13px;color:var(--muted);max-width:90ch;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
footer p{margin:0}
footer .credit{color:var(--ink);font-size:14px}
footer .credit b{color:var(--accent);font-family:var(--f-display);letter-spacing:.04em;font-size:15px}
footer .disc{font-size:12px;opacity:.85}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1><span data-i18n="h1"></span> <em>FM27</em></h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="hdr-right">
    <a class="bmc" href="https://buymeacoffee.com/barfly86" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V8Zm13 1.5h1.5a2.5 2.5 0 0 1 0 5H17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 3.5c0 1 1 1.2 1 2.2M12 3.5c0 1 1 1.2 1 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="supportShort"></span></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="pl" aria-pressed="false">PL</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
    </div>
  </header>

  <div class="grid">
    <form id="f">
      <fieldset class="coachbox">
        <legend data-i18n="fCoach"></legend>
        <select id="coach" name="coach"><option value="" data-i18n="coachNone"></option></select>
        <p class="hint" data-i18n="coachHint"></p>
      </fieldset>
      <fieldset>
        <legend><span data-i18n="fForm"></span> <small data-i18n="fFormSmall"></small></legend>
        <div class="chips big" id="formChips"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="fStyle"></legend>
        <div class="chips big">
          <input type="radio" name="style" id="s-possession" value="possession"><label for="s-possession" data-i18n="st_possession"></label>
          <input type="radio" name="style" id="s-press" value="press" checked><label for="s-press" data-i18n="st_press"></label>
          <input type="radio" name="style" id="s-counter" value="counter"><label for="s-counter" data-i18n="st_counter"></label>
          <input type="radio" name="style" id="s-direct" value="direct"><label for="s-direct" data-i18n="st_direct"></label>
          <input type="radio" name="style" id="s-defence" value="defence"><label for="s-defence" data-i18n="st_defence"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="fWidth"></legend>
        <div class="chips">
          <input type="radio" name="width" id="w-narrow" value="narrow"><label for="w-narrow" data-i18n="w_narrow"></label>
          <input type="radio" name="width" id="w-balanced" value="balanced" checked><label for="w-balanced" data-i18n="w_balanced"></label>
          <input type="radio" name="width" id="w-wide" value="wide"><label for="w-wide" data-i18n="w_wide"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="fLevel"></legend>
        <div class="chips">
          <input type="radio" name="level" id="l-fav" value="fav"><label for="l-fav" data-i18n="l_fav"></label>
          <input type="radio" name="level" id="l-mid" value="mid" checked><label for="l-mid" data-i18n="l_mid"></label>
          <input type="radio" name="level" id="l-und" value="und"><label for="l-und" data-i18n="l_und"></label>
        </div>
      </fieldset>
      <div class="adv">
        <label class="sw" for="adv"><input type="checkbox" id="adv"> <span data-i18n="advLabel"></span></label>
        <p data-i18n="advDesc"></p>
      </div>
    </form>

    <section class="result" aria-live="polite">
      <div class="headline">
        <div>
          <div class="name" id="tName"></div>
          <div class="sub" id="tSub"></div>
        </div>
        <div class="tags" id="tTags"></div>
      </div>

      <div class="board">
        <div class="card">
          <div class="row">
            <div class="toggle" role="group">
              <button type="button" id="bIP" aria-pressed="true" data-i18n="ip"></button>
              <button type="button" id="bOOP" aria-pressed="false" data-i18n="oop"></button>
            </div>
            <div class="legend"><span><i style="background:var(--dD)"></i>Defend</span><span><i style="background:var(--dS)"></i>Support</span><span><i style="background:var(--dA)"></i>Attack</span></div>
          </div>
          <div class="shape-caption" id="shapeCap"></div>
          <svg class="pitch" id="pitch" viewBox="0 0 680 1050" role="img"></svg>
          <div class="variants">
            <h3 data-i18n="oopShape" style="margin-bottom:6px"></h3>
            <div class="chips" id="oopChips"></div>
          </div>
        </div>
        <div class="card tablebox">
          <h3 data-i18n="rolesH"></h3>
          <table>
            <thead><tr><th data-i18n="thPos"></th><th><span class="ph ip"></span><span data-i18n="ip"></span> · <span class="ph oop"></span><span data-i18n="oop"></span></th></tr></thead>
            <tbody id="roles"></tbody>
          </table>
        </div>
      </div>

      <div>
        <h2 data-i18n="checksH"></h2>
        <div class="checks" id="checks"></div>
      </div>

      <div>
        <h2 data-i18n="tiH"></h2>
        <div class="instr">
          <div class="card"><h3 class="band">In Possession</h3><dl id="iIP"></dl></div>
          <div class="card"><h3 class="band">Out of Possession</h3><dl id="iOOP"></dl></div>
        </div>
        <p class="untouched" id="untouched"></p>
      </div>

      <div class="two">
        <div class="card"><h3 data-i18n="whyH"></h3><ul class="plain" id="why"></ul></div>
        <div class="card"><h3 data-i18n="watchH"></h3><ul class="plain" id="watch"></ul></div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" id="copy" data-i18n="copyText"></button>
        <span class="copied" id="copied"></span>
      </div>
      <textarea id="fallback" class="fb" hidden readonly></textarea>

      <div class="card fmf">
        <h3 class="band" data-i18n="fmfH"></h3>
        <div class="setup">
          <b data-i18n="setupH"></b>
          <p class="note" style="color:var(--ink)" data-i18n-html="setupTxt"></p>
          <div class="actions">
            <a class="bm" id="bmLink" href="#" draggable="true" data-i18n="bmLabel"></a>
            <span class="copied" id="bmHint" data-i18n="bmHint"></span>
          </div>
          <details class="alt">
            <summary data-i18n="altSum"></summary>
            <ol class="steps" data-i18n-html="altSteps"></ol>
            <div class="actions">
              <button type="button" class="btn ghost" id="copyBm" data-i18n="copyBm"></button>
              <span class="copied" id="bmMsg"></span>
            </div>
            <textarea id="bmBox" class="fb" hidden readonly></textarea>
          </details>
        </div>
        <b data-i18n="eachH"></b>
        <ol class="steps" data-i18n-html="eachSteps"></ol>
        <div class="actions">
          <button type="button" class="btn" id="copyRecipe" data-i18n="copyRecipe"></button>
          <span class="copied" id="recipeMsg"></span>
        </div>

const TI=[

 ["tempo","in","Overview","Tempo","Normal","TEMPO",["Jak szybko drużyna gra piłką. Wyższe tempo daje więcej akcji, ale też więcej strat i szybsze zmęczenie.","How quickly the team plays the ball. Higher tempo means more attacks but also more turnovers and faster fatigue.","Velocidad con la que el equipo mueve el balón. Más ritmo da más ataques, pero también más pérdidas y más cansancio.","Wie schnell das Team den Ball laufen lässt. Höheres Tempo bringt mehr Angriffe, aber auch mehr Ballverluste und schnellere Ermüdung."]],
 ["attacking-width","in","Overview","Attacking Width","Standard","ATTACKING_WIDTH",["Szerokość ustawienia w ataku. Wąsko daje przewagę w środku, szeroko rozciąga obronę rywala.","Width of the shape in attack. Narrow gives you numbers centrally, wide stretches the opposition defence.","Amplitud en ataque. Estrecho da superioridad en el centro; amplio abre la defensa rival.","Breite der Formation im Angriff. Eng sorgt für Überzahl im Zentrum, breit zieht die gegnerische Abwehr auseinander."]],

 ["creative-freedom","in","Overview","Creative Freedom","Balanced","CREATIVE_FREEDOM",["Swoboda zawodników. Więcej ekspresji to improwizacja, więcej dyscypliny to trzymanie się planu.","Player freedom. More expressive means improvisation, more disciplined means sticking to the plan.","Libertad de los jugadores. Más expresivo es improvisación; más disciplinado es ceñirse al plan.","Freiheit der Spieler. Expressiver heißt Improvisation, disziplinierter heißt, sich an den Plan zu halten."]],

let LANG="en";
try{const s=localStorage.getItem("fm27lang"); if(LANGS.includes(s)) LANG=s;}catch(e){}
const LI=()=>LANGS.indexOf(LANG);
const t=(k,p)=>{let s=I18N[LANG][k]; if(s==null) s=I18N.pl[k]; if(s==null) s=k; if(p) s=s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!=null?p[x]:m); return s;};
const formLabel=F=>F.label||t(F.id);
const posName=p=>(POS_NAME[p]||[])[LI()]||p;
const roleDesc=r=>(ROLE[r]||[])[1+LI()]||"";
const tiExpl=x=>x[6][LI()];

/* ======================= LOGIKA ======================= */
function parse(row,src){
  return {src, si:row[0], ip:row[1], oop:row[2],
    players:row[4].split(" ").map(s=>{const a=s.split(",");return {ip:{pos:a[0],role:ROLES[+a[1]],duty:a[2],pi:[]},oop:{pos:a[3],role:ROLES[+a[4]],duty:a[5],pi:[]}}})};
}
const ALL=P.map(r=>parse(r,"preset")).concat(TEMPLATES.map(r=>parse(r,"template")));
const clone=o=>JSON.parse(JSON.stringify(o));
const isHolder=p=>/^DM/.test(p.oop.pos)||/Screening|Defensive Midfielder/.test(p.oop.role);

function readState(){
  const fd=new FormData(document.getElementById("f"));
  return {form:fd.get("form"),style:fd.get("style"),width:fd.get("width"),level:fd.get("level"),adv:document.getElementById("adv").checked,coach:document.getElementById("coach").value||null};
}
let oopChoice=null;

function build(c){
  const F=FORMATIONS.find(f=>f.id===c.form);
  const si=MAP[c.style][c.width];
  const notes=[];
  let pool=ALL.filter(x=>x.src==="preset"&&x.si===si&&x.ip===F.ip), srcSi=si, borrowed=false;
  if(!pool.length){
    pool=ALL.filter(x=>x.src==="template"&&x.ip===F.ip);
    if(pool.length){borrowed=true;srcSi=null;}
    else{for(const s of NEAR[si]){const p=ALL.filter(x=>x.src==="preset"&&x.si===s&&x.ip===F.ip);if(p.length){pool=p;srcSi=s;borrowed=true;break;}}}
  }
  const defensive=DEFENSIVE_SI.includes(si);
  const advOn=c.adv && !defensive;
  let variant=pool.find(x=>x.oop===oopChoice);
  if(!variant){
    if(advOn) variant=pool.slice().sort((a,b)=>b.players.filter(isHolder).length-a.players.filter(isHolder).length)[0];
    else variant=pool[0];
  }
  const tac=clone(variant);
  if(borrowed){
    const g=GK_BY_SI[si], gk=tac.players.find(p=>p.ip.pos==="GK");
    gk.ip.role=g[0];gk.ip.duty=g[1];gk.oop.role=g[2];gk.oop.duty=g[3];
    notes.push(srcSi?["w_borrow",{si:SI_NAME[si],f:"@F",src:SI_NAME[srcSi]}]:["w_template",{si:SI_NAME[si]}]);
  }
  const ti={...DEF,...STYLE[si].ti};
  const advKeys=new Set();
  if(c.width==="narrow"){
    if(!/Narrower/.test(ti["attacking-width"])) ti["attacking-width"]="Narrower";
    if(ti["progress-through"]==="Balanced") ti["progress-through"]="Middle";
    if(ti["crossing-style"]==="Balanced") ti["crossing-style"]="Low Crosses";
  }else if(c.width==="wide"){
    if(ti["attacking-width"]!=="Much Wider") ti["attacking-width"]="Wider";
    ti["progress-through"]="Both Flanks";
    if(ti["crossing-style"]==="Low Crosses") ti["crossing-style"]="Balanced";
  }
  if(advOn) ADV_TI.forEach(([k,v,skip])=>{ if(!skip(c) && ti[k]!==v){ti[k]=v;advKeys.add(k);} });
  let mi=MENT.indexOf(STYLE[si].ment);
  if(c.level==="fav") mi++; if(c.level==="und") mi--;
  if(advOn) mi++;
  mi=Math.max(1,Math.min(5,mi));
  const ment=MENT[mi];
  const players=tac.players;
  if(advOn){
    players.forEach(p=>{
      if(p.ip.pos==="GK"){p.ip.role="Ball-Playing Goalkeeper";p.ip.duty="S";p.oop.role="Sweeper Keeper";p.oop.duty="A";}
      if(/^DC/.test(p.ip.pos) && /^(Centre-Back|No-Nonsense Centre-Back)$/.test(p.ip.role)){p.ip.role="Ball-Playing Centre-Back";p.ip.duty="D";}
      if(/^D[RL]$/.test(p.ip.pos) && /^(Full-Back|Wing-Back)$/.test(p.ip.role) && c.width!=="wide")
        p.ip.pi=["Attacking Width: Sit Narrower","Dribbling Direction: Cut Inside With Ball","Passing Risks: Take More Risks","Cross From: Byline"];
      if(/^(AM[RL]|M[RL])$/.test(p.ip.pos) && /^(Winger|Inside Winger|Inside Forward|Wide Forward|Wide Midfielder)$/.test(p.ip.role))
        p.ip.pi=["Attacking Width: Stay Wider"];
    });
  }
  const coach=c.coach?COACHES.find(x=>x.id===c.coach):null;
  const coachKeys=new Set();
  if(coach){
    Object.entries(coach.ti).forEach(([k,v])=>{ if(ti[k]!==v){ti[k]=v;coachKeys.add(k);advKeys.delete(k);} });
    coach.roles.forEach(([pos,role,duty])=>{const p=players.find(x=>x.ip.pos===pos); if(p){p.ip.role=role;p.ip.duty=duty;p.coach=true;}});
  }
  const chk=[];
  const ipA=players.filter(p=>p.ip.duty==="A"&&p.ip.pos!=="GK").length;
  const oopD=players.filter(p=>p.oop.duty==="D"&&p.oop.pos!=="GK").length;
  const holders=players.filter(isHolder).length;
  const nonDef=TI.filter(x=>ti[x[0]]!==DEF[x[0]]).length;
  const loe=ti["line-of-engagement"], dl=ti["defensive-line"];
  chk.push(ipA>=6?["warn","c_manyA",{n:ipA}]:["ok","c_balA",{n:ipA}]);
  if(oopD<4) chk.push(["warn","c_fewD",{n:oopD}]);
  if(loe==="High Press" && /Lower/.test(dl)) chk.push(holders>=2?["info","c_gapOk",{n:holders}]:["warn","c_gapBad",{}]);
  if(/Higher/.test(dl)){const sk=players.find(p=>p.oop.pos==="GK").oop.role==="Sweeper Keeper"; chk.push(sk?["info","c_highSK",{}]:["warn","c_highNoSK",{}]);}
  if(ti["defensive-transition"]==="Counter-Press" && /Higher/.test(ti["tempo"])) chk.push(["info","c_stamina",{}]);
  if(ti["attacking-width"].includes("Narrower") && !players.some(p=>/Winger|Wing-Back|Wide Midfielder/.test(p.ip.role)||p.ip.pi.some(x=>/Stay Wider/.test(x)))) chk.push(["warn","c_noWidth",{}]);
  chk.push(nonDef>18?["warn","c_complex",{n:nonDef}]:nonDef<=12?["ok","c_simple",{n:nonDef}]:["ok","c_medium",{n:nonDef}]);
  if(c.level==="und" && loe==="High Press") chk.push(["info","c_undPress",{}]);
  if(c.adv && defensive) chk.push(["info","c_advOff",{}]);
  return {c,F,si,variant,pool,players,ti,advKeys,coachKeys,coach,ment,chk,notes,holders,nonDef,advOn,borrowed};
}

$("bOOP").addEventListener("click",()=>setPhase("oop"));

function roleCell(s,cls){
  return `<div><span class="ph ${cls}"></span><span class="role">${esc(s.role)}</span><span class="duty ${s.duty}">${DUTY[s.duty]}</span>`+
    (s.pi.length?`<span class="pis">${s.pi.map(esc).join(" · ")}</span>`:"")+`<span class="desc">${esc(roleDesc(s.role))}</span></div>`;
}
function tiList(phaseKey){
  let out="", last="";
  TI.filter(x=>x[1]===phaseKey && R.ti[x[0]]!==DEF[x[0]]).forEach(x=>{
    if(x[2]!==last){ out+=`<div class="grp">${x[2]}</div>`; last=x[2]; }
    out+=`<div><dt>${x[3]}: <span class="val">${esc(R.ti[x[0]])}</span>${R.advKeys.has(x[0])?`<span class="adv-mark">${esc(t("advMark"))}</span>`:""}${R.coachKeys.has(x[0])?`<span class="coach-mark">${esc(t("coachMark"))}</span>`:""}</dt><dd>${esc(tiExpl(x))}</dd></div>`;
  });
  return out||`<div class="untouched">${esc(t("allDefault"))}</div>`;
}
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=t(e.dataset.i18n);});
  document.querySelectorAll("[data-i18n-html]").forEach(e=>{e.innerHTML=t(e.dataset.i18nHtml);});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  BOOKMARKLET=makeBookmarklet();
  $("bmLink").setAttribute("href",BOOKMARKLET);
}
function render(){
  R=build(readState());
  const F=R.F, styleName=t("st_"+R.c.style);
  $("tName").textContent=`${formLabel(F)} · ${styleName}`;
  $("tSub").textContent=(R.coach?t("subCoach",{name:R.coach.name})+" · ":"")+t("sub",{si:SI_NAME[R.si],m:R.ment});
  $("tTags").innerHTML=`<span class="tag"><b>Mentality</b>${R.ment}</span><span class="tag"><b>${esc(t("ip"))}</b>${esc(R.variant.ip)}</span><span class="tag"><b>${esc(t("oop"))}</b>${esc(R.variant.oop)}</span><span class="tag"><b>${esc(t("tagTI"))}</b>${R.nonDef}/27</span>`;
  $("oopChips").innerHTML=R.pool.map((x,i)=>`<input type="radio" name="oopv" id="ov-${i}" value="${esc(x.oop)}"${x.oop===R.variant.oop?" checked":""}><label for="ov-${i}">${esc(x.oop)}</label>`).join("");
  const sorted=R.players.slice().sort((a,b)=>(POS[b.ip.pos]||[0,0])[1]-(POS[a.ip.pos]||[0,0])[1]||(POS[a.ip.pos]||[0])[0]-(POS[b.ip.pos]||[0])[0]);
  $("roles").innerHTML=sorted.map(p=>`<tr><td class="pos"><b style="background:var(--${lineOf(p.ip.pos)})">${p.ip.pos}</b><span>${esc(posName(p.ip.pos))}</span></td><td>${roleCell(p.ip,"ip")}${p.coach?`<span class="pis coach">★ ${esc(t("coachMark"))}: ${esc(R.coach.name)}</span>`:""}<div style="height:6px"></div>${roleCell(p.oop,"oop")}${p.oop.pos!==p.ip.pos?`<span class="desc">${esc(t("oopMove",{p:p.oop.pos}))}</span>`:""}</td></tr>`).join("");
  $("checks").innerHTML=R.chk.map(([lv,k,pr])=>`<div class="chk ${lv}"><strong>${esc(t(k+"_t",pr))}</strong>${esc(t(k+"_b",pr))}</div>`).join("");
  $("iIP").innerHTML=`<div><dt>Mentality: <span class="val">${R.ment}</span></dt><dd>${esc(t("mentDD"))}</dd></div>`+tiList("in");
  $("iOOP").innerHTML=tiList("out");
  $("untouched").textContent=t("untouched",{n:27-R.nonDef});
  const why=[]; if(R.coach){why.push(t("w_coach",{name:R.coach.name,desc:R.coach.desc[LANG]}));}
  why.push(STYLE[R.si].desc[LANG], t("w_map",{s:styleName,w:t("w_"+R.c.width),si:SI_NAME[R.si]}));
  if(R.c.width==="narrow") why.push(t("y_narrow")); if(R.c.width==="wide") why.push(t("y_wide"));
  if(R.c.level==="fav") why.push(t("w_fav")); if(R.c.level==="und") why.push(t("w_und"));
  if(R.advOn) why.push(t("w_adv"));
  why.push(t("w_shape",{a:R.variant.ip,b:R.variant.oop})+(R.holders>=2?t("w_hold",{n:R.holders}):""));
  R.notes.forEach(([k,p])=>why.push(t(k,{...p,f:formLabel(F)})));
  if(R.coach) why.push(t("coachNote"));
  $("why").innerHTML=why.map(x=>`<li>${esc(x)}</li>`).join("");
  const watch=STYLE[R.si].watch[LANG].slice(); if(R.advOn) watch.push(t("watchAdv"));
  $("watch").innerHTML=watch.map(x=>`<li>${esc(x)}</li>`).join("");
  ["copied","recipeMsg","bmMsg"].forEach(id=>$(id).textContent="");
  ["fallback","recipeBox","bmBox"].forEach(id=>$(id).hidden=true);
  drawPitch();
}
function fillCoach(){
  const sel=$("coach"), cur=sel.value;
  sel.innerHTML=`<option value="">${esc(t("coachNone"))}</option>`+COACHES.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  sel.value=cur;
}
function setRadio(name,val){const i=document.querySelector(`input[name="${name}"][value="${val}"]`); if(i) i.checked=true;}
$("f").addEventListener("change",e=>{
  if(e.target.id==="coach"){
    const c=COACHES.find(x=>x.id===e.target.value);
    if(c){setRadio("form",c.form);setRadio("style",c.style);setRadio("width",c.width);oopChoice=c.oop;}
    else oopChoice=null;
  }else{
    if(["form","style","width"].includes(e.target.name)) $("coach").value="";
    oopChoice=null;
  }
  render(); save();
});
$("oopChips").addEventListener("change",e=>{ oopChoice=e.target.value; render(); save(); });
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang; try{localStorage.setItem("fm27lang",LANG);}catch(e){} renderFormChips(); applyStatic(); fillCoach(); render();}));

/* ======================= PRZEPIS + ZAKŁADKA ======================= */
function recipe(){
  const v=R.variant;
  const base= v.src==="template" ? TEMPLATE_BASE : {g:v.si,ip:v.ip,oop:v.oop};
  const name=(R.coach?`GEN ${R.coach.tag} ${R.F.id==="diamond"?"DIAMOND":R.F.label.split(" ")[0]}${R.advOn?" ADV":""}`:`GEN ${R.F.id==="diamond"?"DIAMOND":R.F.label.split(" ")[0]} ${STYLE_CODE[R.c.style]}${R.advOn?" ADV":""}`).slice(0,30);
  const r={v:1,name,ment:MENT.indexOf(R.ment)+1,base,
    ti:Object.fromEntries(TI.map(x=>[x[5],tiValueKey(x[0],R.ti[x[0]])])),
    p:R.players.map(p=>({in:{pos:p.ip.pos,role:p.ip.role,pi:p.ip.pi.map(x=>PI_KEY[x]).filter(Boolean)},out:{pos:p.oop.pos,role:p.oop.role,pi:[]}}))};
  return "FM27GEN1:"+btoa(JSON.stringify(r));
}
/* Kod zakładki: uruchamiany na tactics.sortitoutsi.net, NIE na tej stronie. */
async function fm27Build(raw,opts){
  opts=opts||{};
  var T=opts.T||{};
  var R0;
  try{R0=JSON.parse(atob(String(raw).trim().replace(/^FM27GEN1:/,"")));}catch(e){return T.badRecipe;}
  var wait=function(ms){return new Promise(function(z){setTimeout(z,ms);});};
  var J=async function(u,o){for(var a=0;a<6;a++){var r=await fetch(u,o);var j=await r.json().catch(function(){return {};});if(r.status===401)throw new Error(T.login);if(r.status===429||j.error==="rate_limited"){await wait(3000*(a+1));continue;}if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;}throw new Error(T.rate);};
  var ALLP=["GK","DR","DL","DC","DCL","DCR","WBR","WBL","DM","DML","DMR","MR","ML","MC","MCL","MCR","AMR","AML","AMC","AMCL","AMCR","STC","STCL","STCR"];
  var ex=(await J("/api/examples")).filter(function(e){return e.section==="FM27 Presets"&&e.group===R0.base.g;});
  var t=null;
  for(var e of ex){var x=(await J("/api/tactic/example?path="+encodeURIComponent(e.path))).tactic;if(x.model.formations.inPossession===R0.base.ip&&x.model.formations.outOfPossession===R0.base.oop){t=x;break;}}
  if(!t)return T.noBase+R0.base.g+" "+R0.base.ip+" / "+R0.base.oop;
  var S=t.state,C=t.container,M=t.model,errs=[];
  var E=async function(op){try{var j=await J("/api/tactic/edit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({state:S,op:op,container:C})});S=j.state;C=j.container;M=j.model;return true;}catch(err){errs.push(op.type+" "+(op.setting||op.role||op.position||"")+": "+err.message);return false;}};
  var prog=opts.onProgress||function(){};
  prog(T.pName);
  await E({type:"rename",name:R0.name});
  await E({type:"mentality",value:R0.ment});
  var ti=0,tn=Object.keys(R0.ti).length;
  for(var k in R0.ti){ti++;prog(T.pTi+ti+T.of+tn);await E({type:"teamInstruction26",setting:k,value:R0.ti[k]});}
  for(var ph of ["in","out"]){
    var key=ph==="in"?"inPossession":"outOfPossession";
    prog(ph==="in"?T.pIn:T.pOut);
    for(var guard=0;guard<60;guard++){
      var cur=M.players.map(function(p){return p.phases[key].position;});
      var todo=R0.p.map(function(q,i){return i;}).filter(function(i){return cur[i]!==R0.p[i][ph].pos;});
      if(!todo.length)break;
      var moved=false;
      for(var i of todo){var tgt=R0.p[i][ph].pos;if(cur.indexOf(tgt)<0){moved=await E({type:"position26",player:i,phase:ph,position:tgt});if(moved)break;}}
      if(!moved){var bi=cur.indexOf(R0.p[todo[0]][ph].pos);var free=ALLP.filter(function(f){return f!=="GK"&&cur.indexOf(f)<0;});
        var ok=false;for(var f of free){ok=await E({type:"position26",player:bi,phase:ph,position:f});if(ok)break;}
        if(!ok)break;}
    }
    for(var n=0;n<R0.p.length;n++){var q=R0.p[n][ph];
      if(M.players[n].phases[key].role!==q.role)await E({type:"role26",player:n,phase:ph,role:q.role});
      for(var pi of q.pi){await E({type:"playerInstruction26",player:n,phase:ph,setting:pi[0],value:pi[1]});}}
  }
  var bad=[];
  R0.p.forEach(function(q,n){["in","out"].forEach(function(ph){var a=M.players[n].phases[ph==="in"?"inPossession":"outOfPossession"];if(a.position!==q[ph].pos||a.role!==q[ph].role)bad.push((ph==="in"?T.ip:T.oop)+": "+q[ph].pos+" "+q[ph].role+" ("+T.is+": "+a.position+" "+a.role+")");});});
  prog(T.pDl);
  var d;
  for(var a2=0;a2<6;a2++){d=await fetch("/api/tactic/download",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({state:S,name:R0.name,container:C})});if(d.status!==429)break;await wait(3000*(a2+1));}
  if(d.status===401)return T.login;
  if(!d.ok)return T.dlFail+d.status+").";
  var blob=await d.blob();
  if(opts.returnBlob)return {blob:blob,errs:errs,bad:bad,model:M};
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=R0.name+".fmf";document.body.appendChild(a);a.click();a.remove();
  return T.done.replace("{name}",R0.name)+"\n("+M.formations.inPossession+" / "+M.formations.outOfPossession+")\n\n"+T.hint+
    (bad.length?"\n\n"+T.bad+"\n- "+bad.join("\n- "):"")+
    (errs.length?"\n\n"+T.skipped+" ("+errs.length+"):\n- "+errs.slice(0,8).join("\n- "):"");
}
function fm27Ui(build,T){
  if(!/sortitoutsi/.test(location.host)){alert(T.notSite);return;}
  var old=document.getElementById("fm27gen-ui");if(old)old.remove();
  var w=document.createElement("div");w.id="fm27gen-ui";
  w.setAttribute("style","position:fixed;z-index:2147483647;top:20px;right:20px;width:400px;max-width:calc(100vw - 40px);background:rgb(26,22,68);color:rgb(238,240,250);border:3px solid rgb(47,211,167);border-radius:12px;box-shadow:0 12px 48px rgba(0,0,0,.55);font:15px/1.45 system-ui,sans-serif;padding:18px;box-sizing:border-box");
  w.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin:-18px -18px 12px;padding:10px 18px;background:rgb(22,105,94);border-radius:8px 8px 0 0"><b style="font-size:17px;color:white"></b><button data-x style="border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:white">×</button></div>'+
   '<div data-s style="margin-bottom:8px"></div>'+
   '<textarea data-t style="width:358px;max-width:calc(100vw - 80px);height:84px;box-sizing:border-box;font:12px monospace;border:1px solid rgb(53,47,112);border-radius:6px;padding:8px;color:rgb(238,240,250);background:rgb(14,11,36)"></textarea>'+
   '<button data-go style="display:block;margin-top:10px;width:358px;max-width:calc(100vw - 80px);padding:12px;border:0;border-radius:8px;background:rgb(47,211,167);color:rgb(5,42,33);font-weight:700;font-size:16px;cursor:pointer"></button>'+
   '<div data-r style="margin-top:12px;white-space:pre-wrap;font-size:14px"></div>'+
   '<a data-c target="_blank" rel="noopener" style="display:none;margin-top:12px;text-align:center;background:rgb(255,221,0);color:rgb(27,20,0);font-weight:700;text-decoration:none;border-radius:999px;padding:9px 14px"></a>';
  document.body.appendChild(w);
  var q=function(a){return w.querySelector("["+a+"]");};
  w.querySelector("b").textContent=T.title+" · barfly86";q("data-c").href="https://buymeacoffee.com/barfly86";q("data-c").textContent=T.support;q("data-x").title=T.close;q("data-s").innerHTML=T.intro;q("data-t").placeholder=T.ph;q("data-go").textContent=T.btn;
  q("data-x").onclick=function(){w.remove();};
  fetch("/api/auth/me").then(function(r){if(r.status===401){q("data-s").textContent=T.login;q("data-s").style.color="rgb(255,210,127)";}}).catch(function(){});
  try{navigator.clipboard.readText().then(function(x){if(/^\s*FM27GEN1:/.test(x)){q("data-t").value=x.trim();q("data-s").textContent=T.fromClip;}}).catch(function(){});}catch(e){}
  q("data-go").onclick=async function(){
    var b=q("data-go"),r=q("data-r"),raw=q("data-t").value;
    if(!/FM27GEN1:/.test(raw)){r.textContent=T.need;return;}
    b.disabled=true;b.style.opacity=".6";b.textContent=T.working;
    try{r.textContent=await build(raw,{T:T,onProgress:function(s){r.textContent=s;}});if(/^\u2713/.test(r.textContent))q("data-c").style.display="block";}catch(e){r.textContent=(e.message===T.login?"":T.err)+e.message;}
    b.disabled=false;b.style.opacity="1";b.textContent=T.btn;
  };
}
function makeBookmarklet(){
  return ("javascript:("+fm27Ui.toString()+")("+fm27Build.toString()+","+JSON.stringify(BM_T[LANG])+");void 0")
    .replace(/\n\s*/g," ")
    .replace(/[^\x00-\x7f]/g,c=>"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"))
    .replace(/%/g,"\\u0025");
}
let BOOKMARKLET="";

function asText(){
  const L=[`${t("txtTitle")}: ${formLabel(R.F)} · ${t("st_"+R.c.style)} (${t("w_"+R.c.width)})`,
   t("sub",{si:SI_NAME[R.si],m:R.ment}),`${t("ip")}: ${R.variant.ip} | ${t("oop")}: ${R.variant.oop}`,"",`${t("txtRoles")} (${t("ip")} > ${t("oop")}):`];
  R.players.forEach(p=>L.push(`${p.ip.pos}: ${p.ip.role} (${DUTY[p.ip.duty]})${p.ip.pi.length?" ["+p.ip.pi.join("; ")+"]":""} > ${p.oop.pos}: ${p.oop.role} (${DUTY[p.oop.duty]})`));
  L.push("","IN POSSESSION:"); TI.filter(x=>x[1]==="in"&&R.ti[x[0]]!==DEF[x[0]]).forEach(x=>L.push(`- ${x[3]}: ${R.ti[x[0]]}`));
  L.push("","OUT OF POSSESSION:"); TI.filter(x=>x[1]==="out"&&R.ti[x[0]]!==DEF[x[0]]).forEach(x=>L.push(`- ${x[3]}: ${R.ti[x[0]]}`));
  L.push("",t("txtRest"),"",`${t("h1")} FM27 · ${t("byLabel")} barfly86`);
  return L.join("\n");
}
function copyTo(text,box,msg,okText){
  box.value=text;
  const fb=()=>{box.hidden=false;box.focus();box.select();msg.textContent=t("copyFb");};
  try{navigator.clipboard.writeText(text).then(()=>{box.hidden=true;msg.textContent=okText;},fb);}catch(e){fb();}
}
$("copy").addEventListener("click",()=>copyTo(asText(),$("fallback"),$("copied"),t("copied")));
$("copyRecipe").addEventListener("click",()=>copyTo(recipe(),$("recipeBox"),$("recipeMsg"),t("recipeCopied")));
$("copyBm").addEventListener("click",()=>copyTo(BOOKMARKLET,$("bmBox"),$("bmMsg"),t("bmCopied")));
$("bmLink").addEventListener("click",e=>{e.preventDefault();$("bmHint").textContent=t("bmClick");});

fillCoach();
function save(){try{localStorage.setItem("fm27gen2",JSON.stringify({...readState(),oop:oopChoice}));}catch(e){}}
try{const s=JSON.parse(localStorage.getItem("fm27gen2")||"null");
  if(s){["form","style","width","level"].forEach(k=>{const i=document.querySelector(`input[name="${k}"][value="${s[k]}"]`); if(i) i.checked=true;});
    $("adv").checked=!!s.adv; oopChoice=s.oop||null; if(s.coach&&COACHES.some(c=>c.id===s.coach)) $("coach").value=s.coach;}}catch(e){}
window.__fm27={build,FORMATIONS,MAP,recipe:()=>recipe(),bm:()=>BOOKMARKLET,setLang:l=>{LANG=l;renderFormChips();applyStatic();fillCoach();render();},COACHES,I18N,t};
applyStatic();
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawPitch);
})();
